name: Build and Deploy

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: Kubernetes namespace to deploy into
        required: true
        default: eco-system
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    name: Build Images and Deploy Helm Charts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image names
        run: |
          OWNER_LC="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_PREFIX=${REGISTRY}/${OWNER_LC}/eco-system" >> "$GITHUB_ENV"
          echo "NAMESPACE=${{ inputs.namespace || 'eco-system' }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push user-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          build-args: |
            SERVICE_PATH=./user-management/backend/app/user-service/cmd
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/user-service:${{ env.IMAGE_TAG }}

      - name: Build and push user-gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          build-args: |
            SERVICE_PATH=./user-management/backend/app/user-gateway/cmd
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/user-gateway:${{ env.IMAGE_TAG }}

      - name: Build and push admin-web-app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./user-management/frontend/app/admin-web-app/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/admin-web-app:${{ env.IMAGE_TAG }}

      - name: Build and push storybook image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./shared-components/frontend/app/storybook/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/storybook:${{ env.IMAGE_TAG }}

      - name: Build and push liquibase image
        uses: docker/build-push-action@v6
        with:
          context: ./foundation/liquibase
          file: ./foundation/liquibase/dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/liquibase:${{ env.IMAGE_TAG }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG_B64 }}" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Configure image pull secret
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry ghcr-pull-secret \
            --namespace "$NAMESPACE" \
            --docker-server="$REGISTRY" \
            --docker-username='${{ secrets.GHCR_USERNAME }}' \
            --docker-password='${{ secrets.GHCR_TOKEN }}' \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Build Helm dependencies
        run: |
          helm dependency build foundation/postgres/deployment
          helm dependency build foundation/liquibase/deployment
          helm dependency build shared-components/frontend/app/storybook/deployment
          helm dependency build user-management/backend/app/user-service/deployment
          helm dependency build user-management/backend/app/user-gateway/deployment
          helm dependency build user-management/frontend/app/admin-web-app/deployment
          helm dependency build foundation/deployment
          helm dependency build shared-components/deployment
          helm dependency build user-management/deployment

      - name: Deploy foundation
        run: |
          helm upgrade --install foundation foundation/deployment \
            --namespace "$NAMESPACE" \
            --create-namespace \
            --set liquibase.app.image.repository="$IMAGE_PREFIX/liquibase" \
            --set liquibase.app.image.tag="$IMAGE_TAG" \
            --set liquibase.app.imagePullSecrets[0].name=ghcr-pull-secret \
            --set-string postgres.app.secret.stringData.POSTGRES_PASSWORD='${{ secrets.POSTGRES_PASSWORD }}' \
            --set-string postgres.app.secret.stringData.LIQUIBASE_PASSWORD='${{ secrets.LIQUIBASE_PASSWORD }}' \
            --set-string postgres.app.secret.stringData.APP_PASSWORD='${{ secrets.APP_PASSWORD }}' \
            --set-string liquibase.app.secret.stringData.LIQUIBASE_COMMAND_PASSWORD='${{ secrets.LIQUIBASE_PASSWORD }}'

      - name: Deploy shared-components
        run: |
          helm upgrade --install shared-components shared-components/deployment \
            --namespace "$NAMESPACE" \
            --create-namespace \
            --set storybook.app.image.repository="$IMAGE_PREFIX/storybook" \
            --set storybook.app.image.tag="$IMAGE_TAG" \
            --set storybook.app.imagePullSecrets[0].name=ghcr-pull-secret

      - name: Deploy user-management
        run: |
          helm upgrade --install user-management user-management/deployment \
            --namespace "$NAMESPACE" \
            --create-namespace \
            --set user-service.app.image.repository="$IMAGE_PREFIX/user-service" \
            --set user-service.app.image.tag="$IMAGE_TAG" \
            --set user-service.app.imagePullSecrets[0].name=ghcr-pull-secret \
            --set user-gateway.app.image.repository="$IMAGE_PREFIX/user-gateway" \
            --set user-gateway.app.image.tag="$IMAGE_TAG" \
            --set user-gateway.app.imagePullSecrets[0].name=ghcr-pull-secret \
            --set admin-web-app.app.image.repository="$IMAGE_PREFIX/admin-web-app" \
            --set admin-web-app.app.image.tag="$IMAGE_TAG" \
            --set admin-web-app.app.imagePullSecrets[0].name=ghcr-pull-secret

      - name: Show rollout status
        run: |
          kubectl get all -n "$NAMESPACE"

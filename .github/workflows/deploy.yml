      - name: Wait for user-management rollout
        shell: bash
        run: |
          set -euo pipefail
          kubectl rollout status deployment/user-gateway -n "$NAMESPACE" --timeout=180s
          kubectl rollout status deployment/admin-web-app -n "$NAMESPACE" --timeout=180s

      - name: Wait for product-management rollout
        shell: bash
        run: |
          set -euo pipefail
          kubectl rollout status deployment/product-gateway -n "$NAMESPACE" --timeout=180s
          kubectl rollout status deployment/product-admin-web-app -n "$NAMESPACE" --timeout=180s

      - name: Run deployed gateway functional tests
        shell: bash
        env:
          GATEWAY_BASE_URL: http://127.0.0.1:18080
          FUNCTIONAL_TEST_EMAIL: admin@test.com
          FUNCTIONAL_TEST_PASSWORD: password
        run: |
          set -euo pipefail

          show_gateway_logs() {
            echo "::group::Recent user-gateway logs"
            kubectl logs -n "$NAMESPACE" deployment/user-gateway --tail=120 || true
            echo "::endgroup::"
          }
          kubectl port-forward -n "$NAMESPACE" service/user-gateway 18080:8080 &
          PORT_FORWARD_PID="$!"
          trap 'kill "$PORT_FORWARD_PID" 2>/dev/null || true; show_gateway_logs' EXIT

          for attempt in {1..30}; do
            if curl --silent --fail --request OPTIONS "$GATEWAY_BASE_URL/api/auth/login" >/dev/null; then
              break
            fi

            if [[ "$attempt" == "30" ]]; then
              echo "Timed out waiting for port-forwarded user-gateway service" >&2
              exit 1
            fi

            sleep 1
          done

          go test ./user-management/backend/app/user-gateway/routes \
            -tags integration \
            -run TestDeployedGatewayFunctional \
            -v

      - name: Run deployed product gateway functional tests
        shell: bash

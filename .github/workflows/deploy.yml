name: Build and Deploy

on:
  workflow_dispatch:
    inputs:
      layer:
        description: Layer to deploy
        required: true
        default: application
        type: choice
        options:
          - foundation
          - application
          - all
      namespace:
        description: Application namespace. Feature PRs ignore this and use feature/<10 lowercase chars>.
        required: false
        default: eco-system
      environment_file:
        description: Environment config file under config/
        required: true
        default: hp-prodesk-homelab.txt
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  issues: write

env:
  IMAGE_PREFIX: localhost/eco-system
  IMAGE_TAG: ${{ github.sha }}
  ENVIRONMENT_FILE: ${{ inputs.environment_file || 'hp-prodesk-homelab.txt' }}

jobs:
  prepare:
    name: Prepare deployment context
    runs-on: [self-hosted, linux]
    outputs:
      deploy_foundation: ${{ steps.context.outputs.deploy_foundation }}
      deploy_application: ${{ steps.context.outputs.deploy_application }}
      namespace: ${{ steps.context.outputs.namespace }}
      foundation_namespace: ${{ steps.context.outputs.foundation_namespace }}
      admin_web_app_host: ${{ steps.context.outputs.admin_web_app_host }}
      user_gateway_host: ${{ steps.context.outputs.user_gateway_host }}
      user_service_host: ${{ steps.context.outputs.user_service_host }}
      storybook_host: ${{ steps.context.outputs.storybook_host }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve namespaces and hosts
        id: context
        shell: bash
        run: |
          set -euo pipefail

          CONFIG_FILE="config/${ENVIRONMENT_FILE}"
          if [[ ! -f "$CONFIG_FILE" ]]; then
            echo "Missing environment config: $CONFIG_FILE" >&2
            exit 1
          fi

          set -a
          . "$CONFIG_FILE"
          set +a

          EVENT_NAME="${{ github.event_name }}"
          REQUESTED_LAYER="${{ inputs.layer || 'all' }}"
          NAMESPACE="${{ inputs.namespace || '' }}"

          DEPLOY_FOUNDATION=false
          DEPLOY_APPLICATION=false

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            HEAD_REF="${{ github.head_ref }}"
            if [[ ! "$HEAD_REF" =~ ^feature/[a-z0-9]{10}$ ]]; then
              echo "Feature deploy branches must match feature/<10 lowercase alphanumeric chars>. Received: $HEAD_REF" >&2
              exit 1
            fi

            NAMESPACE="${HEAD_REF#feature/}"
            DEPLOY_APPLICATION=true
          elif [[ "$EVENT_NAME" == "push" ]]; then
            NAMESPACE="${DEFAULT_APPLICATION_NAMESPACE:-eco-system}"
            # Main deploys intentionally skip foundation. Use workflow_dispatch
            # with layer=foundation when database/foundation changes should roll out.
            DEPLOY_APPLICATION=true
          else
            NAMESPACE="${NAMESPACE:-${DEFAULT_APPLICATION_NAMESPACE:-eco-system}}"
            case "$REQUESTED_LAYER" in
              foundation)
                DEPLOY_FOUNDATION=true
                ;;
              application)
                DEPLOY_APPLICATION=true
                ;;
              all)
                DEPLOY_FOUNDATION=true
                DEPLOY_APPLICATION=true
                ;;
              *)
                echo "Unknown layer: $REQUESTED_LAYER" >&2
                exit 1
                ;;
            esac
          fi

          FOUNDATION_NAMESPACE="${FOUNDATION_NAMESPACE:-eco-foundation}"
          BASE_DOMAIN="${BASE_DOMAIN:-com}"

          {
            echo "deploy_foundation=$DEPLOY_FOUNDATION"
            echo "deploy_application=$DEPLOY_APPLICATION"
            echo "namespace=$NAMESPACE"
            echo "foundation_namespace=$FOUNDATION_NAMESPACE"
            echo "admin_web_app_host=${NAMESPACE}.admin-web-app.${BASE_DOMAIN}"
            echo "user_gateway_host=${NAMESPACE}.user-gateway.${BASE_DOMAIN}"
            echo "user_service_host=${NAMESPACE}.user-service.${BASE_DOMAIN}"
            echo "storybook_host=${NAMESPACE}.storybook.${BASE_DOMAIN}"
          } >> "$GITHUB_OUTPUT"

  foundation:
    name: Deploy foundation
    needs: prepare
    if: needs.prepare.outputs.deploy_foundation == 'true'
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load environment config
        shell: bash
        run: |
          set -euo pipefail
          set -a
          . "config/${ENVIRONMENT_FILE}"
          set +a
          echo "FOUNDATION_NAMESPACE=${{ needs.prepare.outputs.foundation_namespace }}" >> "$GITHUB_ENV"
          echo "POSTGRES_DB=${POSTGRES_DB:-ecoDB}" >> "$GITHUB_ENV"
          echo "LIQUIBASE_JDBC_URL=${LIQUIBASE_JDBC_URL:-jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ecoDB}}" >> "$GITHUB_ENV"
          echo "POSTGRES_LIQUIBASE_USER=${POSTGRES_LIQUIBASE_USER:-liquibase}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build liquibase image
        shell: bash
        run: |
          docker build \
            -f foundation/liquibase/dockerfile \
            -t "$IMAGE_PREFIX/liquibase:$IMAGE_TAG" \
            foundation/liquibase

      - name: Import liquibase image into k3s
        shell: bash
        run: |
          if command -v k3d >/dev/null 2>&1; then
            k3d image import "$IMAGE_PREFIX/liquibase:$IMAGE_TAG" -c "${K3D_CLUSTER:-eco-cluster}"
          elif command -v k3s >/dev/null 2>&1; then
            docker save "$IMAGE_PREFIX/liquibase:$IMAGE_TAG" | sudo k3s ctr -n k8s.io images import -
          fi

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          if [[ -f "$HOME/.kube/config" ]] && kubectl config current-context >/dev/null 2>&1; then
            echo "Using existing runner kubeconfig at $HOME/.kube/config"
          elif [[ -f "$HOME/.config/k3d/kubeconfig-${K3D_CLUSTER:-eco-cluster}.yaml" ]]; then
            cp "$HOME/.config/k3d/kubeconfig-${K3D_CLUSTER:-eco-cluster}.yaml" "$HOME/.kube/config"
          elif command -v k3d >/dev/null 2>&1 && k3d cluster list "${K3D_CLUSTER:-eco-cluster}" >/dev/null 2>&1; then
            k3d kubeconfig get "${K3D_CLUSTER:-eco-cluster}" > "$HOME/.kube/config"
          elif [[ -f /etc/rancher/k3s/k3s.yaml ]]; then
            sudo cat /etc/rancher/k3s/k3s.yaml > "$HOME/.kube/config"
          elif [[ -n "${KUBE_CONFIG_B64:-}" ]]; then
            echo "$KUBE_CONFIG_B64" | base64 --decode > "$HOME/.kube/config"
          else
            echo "No usable kubeconfig found. Add one at $HOME/.kube/config on the runner, install k3s config at /etc/rancher/k3s/k3s.yaml, or set KUBE_CONFIG_B64." >&2
            exit 1
          fi
          chmod 600 "$HOME/.kube/config"
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}

      - name: Check Kubernetes API
        shell: bash
        run: |
          set -euo pipefail
          kubectl config current-context
          echo "Kubernetes server: $(kubectl config view --minify --raw -o jsonpath='{.clusters[0].cluster.server}')"
          kubectl version --client
          kubectl get --raw=/version
          kubectl get --raw=/api

      - name: Create foundation namespace
        shell: bash
        run: |
          if ! kubectl create namespace "$FOUNDATION_NAMESPACE" 2>namespace-error.log; then
            if grep -q "AlreadyExists" namespace-error.log; then
              echo "Namespace $FOUNDATION_NAMESPACE already exists"
            else
              cat namespace-error.log >&2
              exit 1
            fi
          fi

      - name: Build Helm dependencies
        shell: bash
        run: |
          helm dependency build foundation/postgres/deployment
          helm dependency build foundation/liquibase/deployment
          helm dependency build foundation/deployment

      - name: Deploy postgres and liquibase
        shell: bash
        run: |
          helm upgrade --install foundation foundation/deployment \
            --namespace "$FOUNDATION_NAMESPACE" \
            --set postgres.app.env.POSTGRES_DB="$POSTGRES_DB" \
            --set liquibase.app.image.repository="$IMAGE_PREFIX/liquibase" \
            --set liquibase.app.image.tag="$IMAGE_TAG" \
            --set liquibase.app.image.pullPolicy=Never \
            --set-string liquibase.app.env.LIQUIBASE_COMMAND_URL="$LIQUIBASE_JDBC_URL" \
            --set-string liquibase.app.env.LIQUIBASE_COMMAND_USERNAME="$POSTGRES_LIQUIBASE_USER" \
            --set-string postgres.app.secret.stringData.POSTGRES_PASSWORD='${{ secrets.POSTGRES_PASSWORD }}' \
            --set-string postgres.app.secret.stringData.LIQUIBASE_PASSWORD='${{ secrets.LIQUIBASE_PASSWORD }}' \
            --set-string postgres.app.secret.stringData.APP_PASSWORD='${{ secrets.APP_PASSWORD }}' \
            --set-string liquibase.app.secret.stringData.LIQUIBASE_COMMAND_PASSWORD='${{ secrets.LIQUIBASE_PASSWORD }}'

      - name: Show foundation rollout
        shell: bash
        run: |
          kubectl get all -n "$FOUNDATION_NAMESPACE"

  application:
    name: Build and deploy application
    needs: prepare
    if: needs.prepare.outputs.deploy_application == 'true'
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load environment config
        shell: bash
        run: |
          set -euo pipefail
          set -a
          . "config/${ENVIRONMENT_FILE}"
          set +a

          echo "NAMESPACE=${{ needs.prepare.outputs.namespace }}" >> "$GITHUB_ENV"
          echo "FOUNDATION_NAMESPACE=${{ needs.prepare.outputs.foundation_namespace }}" >> "$GITHUB_ENV"
          echo "POSTGRES_DB=${POSTGRES_DB:-ecoDB}" >> "$GITHUB_ENV"
          echo "POSTGRES_HOST=${POSTGRES_HOST:-postgres.${{ needs.prepare.outputs.foundation_namespace }}.svc.cluster.local}" >> "$GITHUB_ENV"
          echo "POSTGRES_PORT=${POSTGRES_PORT:-5432}" >> "$GITHUB_ENV"
          echo "POSTGRES_APP_USER=${POSTGRES_APP_USER:-app_user}" >> "$GITHUB_ENV"
          echo "USER_SERVICE_INTERNAL_URL=${USER_SERVICE_INTERNAL_URL:-http://user-service:8080}" >> "$GITHUB_ENV"
          echo "INGRESS_CLASS_NAME=${INGRESS_CLASS_NAME:-traefik}" >> "$GITHUB_ENV"
          echo "ADMIN_WEB_APP_HOST=${{ needs.prepare.outputs.admin_web_app_host }}" >> "$GITHUB_ENV"
          echo "USER_GATEWAY_HOST=${{ needs.prepare.outputs.user_gateway_host }}" >> "$GITHUB_ENV"
          echo "USER_SERVICE_HOST=${{ needs.prepare.outputs.user_service_host }}" >> "$GITHUB_ENV"
          echo "STORYBOOK_HOST=${{ needs.prepare.outputs.storybook_host }}" >> "$GITHUB_ENV"
          echo "BACKEND_API_URL=http://${{ needs.prepare.outputs.user_gateway_host }}" >> "$GITHUB_ENV"
          echo "FRONTEND_ORIGIN=http://${{ needs.prepare.outputs.admin_web_app_host }}" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Build backend binaries
        shell: bash
        run: |
          mkdir -p build/bin
          go build -o build/bin/user-service ./user-management/backend/app/user-service/cmd
          go build -o build/bin/user-gateway ./user-management/backend/app/user-gateway/cmd

      - name: Build frontend applications and storybooks
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter admin-web-app build
          pnpm --filter admin-web-app build-storybook
          pnpm --filter storybook build-storybook

      - name: Build local application images
        shell: bash
        run: |
          docker build \
            -f dockerfile \
            --build-arg APP_NAME=user-service \
            -t "$IMAGE_PREFIX/user-service:$IMAGE_TAG" \
            .
          docker build \
            -f dockerfile \
            --build-arg APP_NAME=user-gateway \
            -t "$IMAGE_PREFIX/user-gateway:$IMAGE_TAG" \
            .
          docker build \
            -f user-management/frontend/app/admin-web-app/Dockerfile \
            -t "$IMAGE_PREFIX/admin-web-app:$IMAGE_TAG" \
            .
          docker build \
            -f shared-components/frontend/app/storybook/Dockerfile \
            -t "$IMAGE_PREFIX/storybook:$IMAGE_TAG" \
            .

      - name: Import application images into k3s
        shell: bash
        run: |
          if command -v k3d >/dev/null 2>&1; then
            k3d image import \
              "$IMAGE_PREFIX/user-service:$IMAGE_TAG" \
              "$IMAGE_PREFIX/user-gateway:$IMAGE_TAG" \
              "$IMAGE_PREFIX/admin-web-app:$IMAGE_TAG" \
              "$IMAGE_PREFIX/storybook:$IMAGE_TAG" \
              -c "${K3D_CLUSTER:-eco-cluster}"
          elif command -v k3s >/dev/null 2>&1; then
            docker save \
              "$IMAGE_PREFIX/user-service:$IMAGE_TAG" \
              "$IMAGE_PREFIX/user-gateway:$IMAGE_TAG" \
              "$IMAGE_PREFIX/admin-web-app:$IMAGE_TAG" \
              "$IMAGE_PREFIX/storybook:$IMAGE_TAG" \
              | sudo k3s ctr -n k8s.io images import -
          fi

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          if [[ -f "$HOME/.kube/config" ]] && kubectl config current-context >/dev/null 2>&1; then
            echo "Using existing runner kubeconfig at $HOME/.kube/config"
          elif [[ -f "$HOME/.config/k3d/kubeconfig-${K3D_CLUSTER:-eco-cluster}.yaml" ]]; then
            cp "$HOME/.config/k3d/kubeconfig-${K3D_CLUSTER:-eco-cluster}.yaml" "$HOME/.kube/config"
          elif command -v k3d >/dev/null 2>&1 && k3d cluster list "${K3D_CLUSTER:-eco-cluster}" >/dev/null 2>&1; then
            k3d kubeconfig get "${K3D_CLUSTER:-eco-cluster}" > "$HOME/.kube/config"
          elif [[ -f /etc/rancher/k3s/k3s.yaml ]]; then
            sudo cat /etc/rancher/k3s/k3s.yaml > "$HOME/.kube/config"
          elif [[ -n "${KUBE_CONFIG_B64:-}" ]]; then
            echo "$KUBE_CONFIG_B64" | base64 --decode > "$HOME/.kube/config"
          else
            echo "No usable kubeconfig found. Add one at $HOME/.kube/config on the runner, install k3s config at /etc/rancher/k3s/k3s.yaml, or set KUBE_CONFIG_B64." >&2
            exit 1
          fi
          chmod 600 "$HOME/.kube/config"
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}

      - name: Check Kubernetes API
        shell: bash
        run: |
          set -euo pipefail
          kubectl config current-context
          echo "Kubernetes server: $(kubectl config view --minify --raw -o jsonpath='{.clusters[0].cluster.server}')"
          kubectl version --client
          kubectl get --raw=/version
          kubectl get --raw=/api

      - name: Create application namespace
        shell: bash
        run: |
          if ! kubectl create namespace "$NAMESPACE" 2>namespace-error.log; then
            if grep -q "AlreadyExists" namespace-error.log; then
              echo "Namespace $NAMESPACE already exists"
            else
              cat namespace-error.log >&2
              exit 1
            fi
          fi

      - name: Build Helm dependencies
        shell: bash
        run: |
          helm dependency build shared-components/frontend/app/storybook/deployment
          helm dependency build user-management/backend/app/user-service/deployment
          helm dependency build user-management/backend/app/user-gateway/deployment
          helm dependency build user-management/frontend/app/admin-web-app/deployment
          helm dependency build shared-components/deployment
          helm dependency build user-management/deployment

      - name: Deploy shared-components storybook
        shell: bash
        run: |
          helm upgrade --install shared-components shared-components/deployment \
            --namespace "$NAMESPACE" \
            --set storybook.app.image.repository="$IMAGE_PREFIX/storybook" \
            --set storybook.app.image.tag="$IMAGE_TAG" \
            --set storybook.app.image.pullPolicy=Never \
            --set storybook.app.ingress.enabled=true \
            --set storybook.app.ingress.className="$INGRESS_CLASS_NAME" \
            --set storybook.app.ingress.hosts[0].host="$STORYBOOK_HOST" \
            --set storybook.app.ingress.hosts[0].paths[0].path=/ \
            --set storybook.app.ingress.hosts[0].paths[0].pathType=Prefix

      - name: Deploy user-management
        shell: bash
        run: |
          printf '{"BACKEND_API_URL":"%s","ENABLE_MOCK_API":false}\n' "$BACKEND_API_URL" > runtime-config.json

          helm upgrade --install user-management user-management/deployment \
            --namespace "$NAMESPACE" \
            --set user-service.app.image.repository="$IMAGE_PREFIX/user-service" \
            --set user-service.app.image.tag="$IMAGE_TAG" \
            --set user-service.app.image.pullPolicy=Never \
            --set user-service.app.configMap.enabled=true \
            --set-string user-service.app.configMap.data.DB_DIALECT=postgresql \
            --set-string user-service.app.configMap.data.DB_NAME="$POSTGRES_DB" \
            --set-string user-service.app.configMap.data.DB_HOST="$POSTGRES_HOST" \
            --set-string user-service.app.configMap.data.DB_PORT="$POSTGRES_PORT" \
            --set-string user-service.app.configMap.data.DB_USER="$POSTGRES_APP_USER" \
            --set user-service.app.secret.enabled=true \
            --set-string user-service.app.secret.stringData.DB_PASSWORD='${{ secrets.APP_PASSWORD }}' \
            --set user-service.app.ingress.enabled=true \
            --set user-service.app.ingress.className="$INGRESS_CLASS_NAME" \
            --set user-service.app.ingress.hosts[0].host="$USER_SERVICE_HOST" \
            --set user-service.app.ingress.hosts[0].paths[0].path=/ \
            --set user-service.app.ingress.hosts[0].paths[0].pathType=Prefix \
            --set user-gateway.app.image.repository="$IMAGE_PREFIX/user-gateway" \
            --set user-gateway.app.image.tag="$IMAGE_TAG" \
            --set user-gateway.app.image.pullPolicy=Never \
            --set user-gateway.app.configMap.enabled=true \
            --set-string user-gateway.app.configMap.data.DB_DIALECT=postgresql \
            --set-string user-gateway.app.configMap.data.DB_NAME="$POSTGRES_DB" \
            --set-string user-gateway.app.configMap.data.DB_HOST="$POSTGRES_HOST" \
            --set-string user-gateway.app.configMap.data.DB_PORT="$POSTGRES_PORT" \
            --set-string user-gateway.app.configMap.data.DB_USER="$POSTGRES_APP_USER" \
            --set-string user-gateway.app.configMap.data.USER_SERVICE_URL="$USER_SERVICE_INTERNAL_URL" \
            --set-string user-gateway.app.configMap.data.FRONTEND_ORIGIN="$FRONTEND_ORIGIN" \
            --set user-gateway.app.secret.enabled=true \
            --set-string user-gateway.app.secret.stringData.DB_PASSWORD='${{ secrets.APP_PASSWORD }}' \
            --set user-gateway.app.ingress.enabled=true \
            --set user-gateway.app.ingress.className="$INGRESS_CLASS_NAME" \
            --set user-gateway.app.ingress.hosts[0].host="$USER_GATEWAY_HOST" \
            --set user-gateway.app.ingress.hosts[0].paths[0].path=/ \
            --set user-gateway.app.ingress.hosts[0].paths[0].pathType=Prefix \
            --set admin-web-app.app.image.repository="$IMAGE_PREFIX/admin-web-app" \
            --set admin-web-app.app.image.tag="$IMAGE_TAG" \
            --set admin-web-app.app.image.pullPolicy=Never \
            --set admin-web-app.app.configMap.enabled=true \
            --set admin-web-app.app.configMap.envFrom=false \
            --set-file admin-web-app.app.configMap.data.config\\.json=runtime-config.json \
            --set admin-web-app.app.ingress.enabled=true \
            --set admin-web-app.app.ingress.className="$INGRESS_CLASS_NAME" \
            --set admin-web-app.app.ingress.hosts[0].host="$ADMIN_WEB_APP_HOST" \
            --set admin-web-app.app.ingress.hosts[0].paths[0].path=/ \
            --set admin-web-app.app.ingress.hosts[0].paths[0].pathType=Prefix

      - name: Show application rollout
        shell: bash
        run: |
          kubectl get all,ingress,configmap -n "$NAMESPACE"

      - name: Comment useful links on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- eco-system-useful-links -->';
            const links = [
              ['Admin web app', 'http://${{ needs.prepare.outputs.admin_web_app_host }}'],
              ['Admin web app Storybook', 'http://${{ needs.prepare.outputs.admin_web_app_host }}/storybook'],
              ['Design system Storybook', 'http://${{ needs.prepare.outputs.storybook_host }}'],
              ['User gateway', 'http://${{ needs.prepare.outputs.user_gateway_host }}'],
              ['User service', 'http://${{ needs.prepare.outputs.user_service_host }}'],
            ];

            const body = [
              marker,
              '## Useful Links',
              '',
              `Namespace: \`${{ needs.prepare.outputs.namespace }}\``,
              '',
              ...links.map(([label, url]) => `- [${label}](${url})`),
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

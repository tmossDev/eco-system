      - name: Comment useful links on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- deployment-useful-links -->';
            const links = [
              ['Admin web app', 'http://${{ needs.prepare.outputs.admin_web_app_host }}'],
              ['Admin web app Storybook', 'http://${{ needs.prepare.outputs.admin_web_app_host }}/storybook'],
              ['Product admin web app', 'http://${{ needs.prepare.outputs.product_admin_web_app_host }}'],
              ['Product admin web app Storybook', 'http://${{ needs.prepare.outputs.product_admin_web_app_host }}/storybook'],
              ['Design system Storybook', 'http://${{ needs.prepare.outputs.storybook_host }}'],
              ['User gateway', 'http://${{ needs.prepare.outputs.user_gateway_host }}'],
              ['User service', 'http://${{ needs.prepare.outputs.user_service_host }}'],
              ['Product gateway', 'http://${{ needs.prepare.outputs.product_gateway_host }}'],
              ['Product service', 'http://${{ needs.prepare.outputs.product_service_host }}'],
            ];

            const decoratorBox = `
            <table>
              <tr>
                <td width="100%" style="background-color: #f6f8fa; padding: 12px 16px; border-radius: 6px; border: 1px solid #d1d9e0;">
                  <div style="font-weight: bold; margin-bottom: 8px;">🚀 Useful Links</div>
                  <ul style="margin: 0; padding-left: 20px;">
                    ${links.map(([label, url]) => `<li><a href="${url}">${label}</a></li>`).join('')}
                  </ul>
                  <div style="margin-top: 8px; font-size: 12px; color: #656d76;">Namespace: <code style="background-color: #eaeef2; padding: 2px 6px; border-radius: 3px;">${{ needs.prepare.outputs.namespace }}</code></div>
                </td>
              </tr>
            </table>
            `;

            const body = [
              marker,
              decoratorBox,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

        if: needs.prepare.outputs.build_user_management == 'true' || needs.prepare.outputs.build_product_management == 'true' || needs.prepare.outputs.build_order_management == 'true' || needs.prepare.outputs.build_online_storefront == 'true'
        shell: bash
        run: |
          if [[ "${{ needs.prepare.outputs.build_user_management }}" == "true" ]]; then
            go test ./user-management/backend/app/user-gateway/routes -run 'TestGatewayFunctional'
          fi
          if [[ "${{ needs.prepare.outputs.build_product_management }}" == "true" ]]; then
            go test ./product-management/backend/app/product-gateway/routes -run 'TestProductGatewayFunctional'
          fi
          if [[ "${{ needs.prepare.outputs.build_order_management }}" == "true" ]]; then
            go test ./order-management/backend/app/order-gateway/routes
            go test ./order-management/backend/app/order-service/routes
          fi
          if [[ "${{ needs.prepare.outputs.build_online_storefront }}" == "true" ]]; then
            go test ./online-storefront/backend/app/cart-gateway/routes
            go test ./online-storefront/backend/app/storefront-gateway/routes
          fi

      - name: Set up Node
        if: needs.prepare.outputs.build_user_management == 'true' || needs.prepare.outputs.build_product_management == 'true' || needs.prepare.outputs.build_order_management == 'true' || needs.prepare.outputs.build_online_storefront == 'true' || needs.prepare.outputs.build_storybook == 'true'
        uses: actions/setup-node@v4

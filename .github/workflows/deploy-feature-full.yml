          fi
          if [[ "${{ needs.prepare.outputs.build_online_storefront }}" == "true" ]]; then
            docker build \
              -f dockerfile \
              --build-arg APP_NAME=cart-gateway \
              -t "$IMAGE_PREFIX/cart-gateway:$IMAGE_TAG" \
              .
            docker build \
              -f dockerfile \

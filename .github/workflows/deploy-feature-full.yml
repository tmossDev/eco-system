      - name: Enable ingress TLS
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${INGRESS_TLS_SECRET_NAME:-}" ]]; then
            echo "INGRESS_TLS_SECRET_NAME is empty; leaving ingresses on HTTP."
            exit 0
          fi

          if ! kubectl get secret "$INGRESS_TLS_SECRET_NAME" -n "$NAMESPACE" >/dev/null 2>&1; then
            echo "Missing TLS secret $INGRESS_TLS_SECRET_NAME in namespace $NAMESPACE." >&2
            echo "The Create ingress TLS secret step should create this automatically." >&2
            exit 1
          fi

          mapfile -t ingress_names < <(kubectl get ingress -n "$NAMESPACE" -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}')
          for ingress_name in "${ingress_names[@]}"; do
            mapfile -t ingress_hosts < <(
              kubectl get ingress "$ingress_name" -n "$NAMESPACE" -o jsonpath='{range .spec.rules[*]}{.host}{"\n"}{end}' \
                | sed '/^$/d'
            )

            if [[ "${#ingress_hosts[@]}" -eq 0 ]]; then
              continue
            fi

            hosts_json=""
            for host in "${ingress_hosts[@]}"; do
              if [[ -n "$hosts_json" ]]; then
                hosts_json+=","
              fi
              hosts_json+="\"$host\""
            done

            kubectl patch ingress "$ingress_name" \
              -n "$NAMESPACE" \
              --type merge \
              -p "{\"spec\":{\"tls\":[{\"secretName\":\"$INGRESS_TLS_SECRET_NAME\",\"hosts\":[$hosts_json]}]}}"
          done


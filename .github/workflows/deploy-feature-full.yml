name: Deploy Full Feature

on:
  pull_request:
    types:
      - labeled
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  IMAGE_TAG: ${{ github.sha }}
  ENVIRONMENT_FILE: hp-prodesk-homelab.txt

jobs:
  prepare:
    if: contains(github.event.pull_request.labels.*.name, 'deploy:full-feature')
    name: Prepare deployment context
    runs-on: [self-hosted, linux]
    outputs:
      deploy_foundation: ${{ steps.context.outputs.deploy_foundation }}
      deploy_application: ${{ steps.context.outputs.deploy_application }}
      deploy_ci_cd: ${{ steps.context.outputs.deploy_ci_cd }}
      deploy_user_management: ${{ steps.context.outputs.deploy_user_management }}
      deploy_product_management: ${{ steps.context.outputs.deploy_product_management }}
      deploy_order_management: ${{ steps.context.outputs.deploy_order_management }}
      deploy_online_storefront: ${{ steps.context.outputs.deploy_online_storefront }}
      deploy_storybook: ${{ steps.context.outputs.deploy_storybook }}
      build_user_management: ${{ steps.context.outputs.build_user_management }}
      build_product_management: ${{ steps.context.outputs.build_product_management }}
      build_order_management: ${{ steps.context.outputs.build_order_management }}
      build_online_storefront: ${{ steps.context.outputs.build_online_storefront }}
      build_storybook: ${{ steps.context.outputs.build_storybook }}
      namespace: ${{ steps.context.outputs.namespace }}
      ci_cd_namespace: ${{ steps.context.outputs.ci_cd_namespace }}
      foundation_namespace: ${{ steps.context.outputs.foundation_namespace }}
      admin_web_app_host: ${{ steps.context.outputs.admin_web_app_host }}
      user_gateway_host: ${{ steps.context.outputs.user_gateway_host }}
      user_service_host: ${{ steps.context.outputs.user_service_host }}
      product_admin_web_app_host: ${{ steps.context.outputs.product_admin_web_app_host }}
      product_gateway_host: ${{ steps.context.outputs.product_gateway_host }}
      product_service_host: ${{ steps.context.outputs.product_service_host }}
      order_admin_web_app_host: ${{ steps.context.outputs.order_admin_web_app_host }}
      order_gateway_host: ${{ steps.context.outputs.order_gateway_host }}
      order_service_host: ${{ steps.context.outputs.order_service_host }}
      storefront_web_app_host: ${{ steps.context.outputs.storefront_web_app_host }}
      storybook_host: ${{ steps.context.outputs.storybook_host }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect foundation changes
        id: detect_foundation
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYMENT_MODE="feature-full"
          FOUNDATION_CHANGED=false

          if [[ "$DEPLOYMENT_MODE" == "standard" || "$DEPLOYMENT_MODE" == "main" ]]; then
            # Check if foundation layer files changed since previous commit
            if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
              if ! git diff --quiet HEAD~1 HEAD -- foundation/ >/dev/null 2>&1; then
                FOUNDATION_CHANGED=true
              fi
            else
              # On initial commit, treat foundation files as changed if any exist
              if git ls-tree -r --name-only HEAD | grep -q '^foundation/'; then
                FOUNDATION_CHANGED=true
              fi
            fi
          elif [[ "$DEPLOYMENT_MODE" == "feature-changed" || "$DEPLOYMENT_MODE" == "feature-full" ]]; then
            # Check if foundation layer files changed in the PR
            BASE_REF="${{ github.base_ref || 'main' }}"
            if ! git show-ref --quiet "refs/remotes/origin/$BASE_REF"; then
              git fetch origin "$BASE_REF":"refs/remotes/origin/$BASE_REF"
            fi
            if ! git diff --quiet origin/"$BASE_REF" HEAD -- foundation/ >/dev/null 2>&1; then
              FOUNDATION_CHANGED=true
            fi
          fi

          echo "foundation_changed=$FOUNDATION_CHANGED" >> "$GITHUB_OUTPUT"

      - name: Detect CI/CD changes
        id: detect_ci_cd
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYMENT_MODE="feature-full"
          CI_CD_CHANGED=false

          if [[ "$DEPLOYMENT_MODE" == "standard" || "$DEPLOYMENT_MODE" == "main" ]]; then
            if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
              if ! git diff --quiet HEAD~1 HEAD -- ci-cd/ >/dev/null 2>&1; then
                CI_CD_CHANGED=true
              fi
            else
              if git ls-tree -r --name-only HEAD | grep -q '^ci-cd/'; then
                CI_CD_CHANGED=true
              fi
            fi
          elif [[ "$DEPLOYMENT_MODE" == "feature-changed" || "$DEPLOYMENT_MODE" == "feature-full" ]]; then
            BASE_REF="${{ github.base_ref || 'main' }}"
            if ! git show-ref --quiet "refs/remotes/origin/$BASE_REF"; then
              git fetch origin "$BASE_REF":"refs/remotes/origin/$BASE_REF"
            fi
            if ! git diff --quiet origin/"$BASE_REF" HEAD -- ci-cd/ >/dev/null 2>&1; then
              CI_CD_CHANGED=true
            fi
          fi

          echo "ci_cd_changed=$CI_CD_CHANGED" >> "$GITHUB_OUTPUT"

      - name: Detect application changes
        id: detect_application
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYMENT_MODE="feature-full"
          USER_MANAGEMENT_CHANGED=false
          PRODUCT_MANAGEMENT_CHANGED=false
          ORDER_MANAGEMENT_CHANGED=false
          ONLINE_STOREFRONT_CHANGED=false
          STORYBOOK_CHANGED=false
          SHARED_APPLICATION_CHANGED=false

          changed_files="$(mktemp)"

          if [[ "$DEPLOYMENT_MODE" == "standard" || "$DEPLOYMENT_MODE" == "main" ]]; then
            if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
              git diff --name-only HEAD~1 HEAD > "$changed_files"
            else
              git ls-tree -r --name-only HEAD > "$changed_files"
            fi
          elif [[ "$DEPLOYMENT_MODE" == "feature-changed" || "$DEPLOYMENT_MODE" == "feature-full" ]]; then
            BASE_REF="${{ github.base_ref || 'main' }}"
            if ! git show-ref --quiet "refs/remotes/origin/$BASE_REF"; then
              git fetch origin "$BASE_REF":"refs/remotes/origin/$BASE_REF"
            fi
            git diff --name-only origin/"$BASE_REF" HEAD > "$changed_files"
          else
            : > "$changed_files"
          fi

          if grep -qE '^user-management/' "$changed_files"; then
            USER_MANAGEMENT_CHANGED=true
          fi
          if grep -qE '^product-management/' "$changed_files"; then
            PRODUCT_MANAGEMENT_CHANGED=true
          fi
          if grep -qE '^order-management/' "$changed_files"; then
            ORDER_MANAGEMENT_CHANGED=true
          fi
          if grep -qE '^online-storefront/' "$changed_files"; then
            ONLINE_STOREFRONT_CHANGED=true
          fi
          if grep -qE '^shared-components/' "$changed_files"; then
            STORYBOOK_CHANGED=true
            SHARED_APPLICATION_CHANGED=true
          fi
          if grep -qE '^(go\.mod|go\.sum|dockerfile|pnpm-lock\.yaml|pnpm-workspace\.yaml)$' "$changed_files"; then
            SHARED_APPLICATION_CHANGED=true
          fi

          if [[ "$SHARED_APPLICATION_CHANGED" == "true" ]]; then
            USER_MANAGEMENT_CHANGED=true
            PRODUCT_MANAGEMENT_CHANGED=true
            ORDER_MANAGEMENT_CHANGED=true
            ONLINE_STOREFRONT_CHANGED=true
          fi

          {
            echo "user_management_changed=$USER_MANAGEMENT_CHANGED"
            echo "product_management_changed=$PRODUCT_MANAGEMENT_CHANGED"
            echo "order_management_changed=$ORDER_MANAGEMENT_CHANGED"
            echo "online_storefront_changed=$ONLINE_STOREFRONT_CHANGED"
            echo "storybook_changed=$STORYBOOK_CHANGED"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve namespaces and hosts
        id: context
        shell: bash
        run: |
          set -euo pipefail

          CONFIG_FILE="config/${ENVIRONMENT_FILE}"
          if [[ ! -f "$CONFIG_FILE" ]]; then
            echo "Missing environment config: $CONFIG_FILE" >&2
            exit 1
          fi

          set -a
          . "$CONFIG_FILE"
          set +a

          DEPLOYMENT_MODE="feature-full"
          REQUESTED_LAYER="application"
          APPLICATION_DEPLOY_SCOPE="all"
          NAMESPACE=""

          DEPLOY_FOUNDATION=false
          DEPLOY_APPLICATION=false
          DEPLOY_CI_CD=false
          DEPLOY_USER_MANAGEMENT=false
          DEPLOY_PRODUCT_MANAGEMENT=false
          DEPLOY_ORDER_MANAGEMENT=false
          DEPLOY_ONLINE_STOREFRONT=false
          DEPLOY_STORYBOOK=false
          BUILD_USER_MANAGEMENT="${{ steps.detect_application.outputs.user_management_changed }}"
          BUILD_PRODUCT_MANAGEMENT="${{ steps.detect_application.outputs.product_management_changed }}"
          BUILD_ORDER_MANAGEMENT="${{ steps.detect_application.outputs.order_management_changed }}"
          BUILD_ONLINE_STOREFRONT="${{ steps.detect_application.outputs.online_storefront_changed }}"
          BUILD_STORYBOOK="${{ steps.detect_application.outputs.storybook_changed }}"

          if [[ "$DEPLOYMENT_MODE" == "feature-changed" || "$DEPLOYMENT_MODE" == "feature-full" ]]; then
            HEAD_REF="${{ github.head_ref }}"
            if [[ ! "$HEAD_REF" =~ ^feature/[a-z0-9]{1,10}$ ]]; then
              echo "Feature deploy branches must match feature/<1-10 lowercase alphanumeric chars>. Received: $HEAD_REF" >&2
              exit 1
            fi

            NAMESPACE="${HEAD_REF#feature/}"
            DEPLOY_APPLICATION=true
            DEPLOY_CI_CD=false

            if [[ "$DEPLOYMENT_MODE" == "feature-full" ]]; then
              DEPLOY_FOUNDATION=true
              DEPLOY_USER_MANAGEMENT=true
              DEPLOY_PRODUCT_MANAGEMENT=true
              DEPLOY_ORDER_MANAGEMENT=true
              DEPLOY_ONLINE_STOREFRONT=true
              DEPLOY_STORYBOOK=true
            else
              DEPLOY_FOUNDATION=false
              DEPLOY_USER_MANAGEMENT="$BUILD_USER_MANAGEMENT"
              DEPLOY_PRODUCT_MANAGEMENT="$BUILD_PRODUCT_MANAGEMENT"
              DEPLOY_ORDER_MANAGEMENT="$BUILD_ORDER_MANAGEMENT"
              DEPLOY_ONLINE_STOREFRONT="$BUILD_ONLINE_STOREFRONT"
              DEPLOY_STORYBOOK="$BUILD_STORYBOOK"
            fi
          elif [[ "$DEPLOYMENT_MODE" == "main" ]]; then
            NAMESPACE="${DEFAULT_APPLICATION_NAMESPACE:-eco-test}"
            DEPLOY_APPLICATION=true
            DEPLOY_CI_CD="${{ steps.detect_ci_cd.outputs.ci_cd_changed }}"
            DEPLOY_USER_MANAGEMENT="$BUILD_USER_MANAGEMENT"
            DEPLOY_PRODUCT_MANAGEMENT="$BUILD_PRODUCT_MANAGEMENT"
            DEPLOY_ORDER_MANAGEMENT="$BUILD_ORDER_MANAGEMENT"
            DEPLOY_ONLINE_STOREFRONT="$BUILD_ONLINE_STOREFRONT"
            DEPLOY_STORYBOOK="$BUILD_STORYBOOK"
            if [[ "${{ steps.detect_foundation.outputs.foundation_changed }}" == "true" ]]; then
              DEPLOY_FOUNDATION=true
            fi
          elif [[ "$DEPLOYMENT_MODE" == "standard" ]]; then
            NAMESPACE="${NAMESPACE:-${DEFAULT_APPLICATION_NAMESPACE:-eco-test}}"
            case "$REQUESTED_LAYER" in
              ci-cd)
                DEPLOY_CI_CD=true
                DEPLOY_FOUNDATION=false
                DEPLOY_APPLICATION=false
                ;;
              foundation)
                DEPLOY_FOUNDATION=true
                DEPLOY_CI_CD=false
                DEPLOY_APPLICATION=false
                ;;
              application)
                DEPLOY_APPLICATION=true
                DEPLOY_CI_CD=false
                DEPLOY_FOUNDATION=false
                ;;
              all)
                DEPLOY_CI_CD=true
                DEPLOY_FOUNDATION=true
                DEPLOY_APPLICATION=true
                ;;
              *)
                echo "Unknown layer: $REQUESTED_LAYER" >&2
                exit 1
                ;;
            esac

            if [[ "$DEPLOY_APPLICATION" == "true" ]]; then
              case "$APPLICATION_DEPLOY_SCOPE" in
                changed)
                  DEPLOY_USER_MANAGEMENT="$BUILD_USER_MANAGEMENT"
                  DEPLOY_PRODUCT_MANAGEMENT="$BUILD_PRODUCT_MANAGEMENT"
                  DEPLOY_ORDER_MANAGEMENT="$BUILD_ORDER_MANAGEMENT"
                  DEPLOY_ONLINE_STOREFRONT="$BUILD_ONLINE_STOREFRONT"
                  DEPLOY_STORYBOOK="$BUILD_STORYBOOK"
                  ;;
                all)
                  DEPLOY_USER_MANAGEMENT=true
                  DEPLOY_PRODUCT_MANAGEMENT=true
                  DEPLOY_ORDER_MANAGEMENT=true
                  DEPLOY_ONLINE_STOREFRONT=true
                  DEPLOY_STORYBOOK=true
                  ;;
                *)
                  echo "Unknown application deploy scope: $APPLICATION_DEPLOY_SCOPE" >&2
                  exit 1
                  ;;
              esac
            fi
          else
            echo "Unknown deployment mode: $DEPLOYMENT_MODE" >&2
            exit 1
          fi

          if [[ "$DEPLOY_USER_MANAGEMENT" != "true" \
            && "$DEPLOY_PRODUCT_MANAGEMENT" != "true" \
            && "$DEPLOY_ORDER_MANAGEMENT" != "true" \
            && "$DEPLOY_ONLINE_STOREFRONT" != "true" \
            && "$DEPLOY_STORYBOOK" != "true" ]]; then
            DEPLOY_APPLICATION=false
          fi

          # For feature branches with foundation changes, deploy foundation to feature namespace
          # For main and manual deploys, use dedicated foundation namespace
          if [[ "$DEPLOYMENT_MODE" == feature-* ]] && [[ "$DEPLOY_FOUNDATION" == "true" ]]; then
            FOUNDATION_NAMESPACE="$NAMESPACE"
          else
            FOUNDATION_NAMESPACE="${FOUNDATION_NAMESPACE:-eco-foundation}"
          fi
          BASE_DOMAIN="${BASE_DOMAIN:-com}"
          CI_CD_NAMESPACE="${CI_CD_NAMESPACE:-eco-cicd}"

          {
            echo "deploy_ci_cd=$DEPLOY_CI_CD"
            echo "deploy_foundation=$DEPLOY_FOUNDATION"
            echo "deploy_application=$DEPLOY_APPLICATION"
            echo "deploy_user_management=$DEPLOY_USER_MANAGEMENT"
            echo "deploy_product_management=$DEPLOY_PRODUCT_MANAGEMENT"
            echo "deploy_order_management=$DEPLOY_ORDER_MANAGEMENT"
            echo "deploy_online_storefront=$DEPLOY_ONLINE_STOREFRONT"
            echo "deploy_storybook=$DEPLOY_STORYBOOK"
            echo "build_user_management=$BUILD_USER_MANAGEMENT"
            echo "build_product_management=$BUILD_PRODUCT_MANAGEMENT"
            echo "build_order_management=$BUILD_ORDER_MANAGEMENT"
            echo "build_online_storefront=$BUILD_ONLINE_STOREFRONT"
            echo "build_storybook=$BUILD_STORYBOOK"
            echo "namespace=$NAMESPACE"
            echo "ci_cd_namespace=$CI_CD_NAMESPACE"
            echo "foundation_namespace=$FOUNDATION_NAMESPACE"
            echo "admin_web_app_host=${NAMESPACE}.admin-web-app.${BASE_DOMAIN}"
            echo "user_gateway_host=${NAMESPACE}.user-gateway.${BASE_DOMAIN}"
            echo "user_service_host=${NAMESPACE}.user-service.${BASE_DOMAIN}"
            echo "product_admin_web_app_host=${NAMESPACE}.product-admin-web-app.${BASE_DOMAIN}"
            echo "product_gateway_host=${NAMESPACE}.product-gateway.${BASE_DOMAIN}"
            echo "product_service_host=${NAMESPACE}.product-service.${BASE_DOMAIN}"
            echo "order_admin_web_app_host=${NAMESPACE}.order-admin-web-app.${BASE_DOMAIN}"
            echo "order_gateway_host=${NAMESPACE}.order-gateway.${BASE_DOMAIN}"
            echo "order_service_host=${NAMESPACE}.order-service.${BASE_DOMAIN}"
            echo "storefront_web_app_host=${NAMESPACE}.storefront-web-app.${BASE_DOMAIN}"
            echo "storybook_host=${NAMESPACE}.storybook.${BASE_DOMAIN}"
          } >> "$GITHUB_OUTPUT"

  ci_cd:
    name: Deploy CI/CD services
    needs: prepare
    if: needs.prepare.outputs.deploy_ci_cd == 'true'
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load environment config
        shell: bash
        run: |
          set -euo pipefail
          set -a
          . "config/${ENVIRONMENT_FILE}"
          set +a

          if [[ -z "${NEXUS_DOCKER_REGISTRY:-}" ]]; then
            echo "Missing NEXUS_DOCKER_REGISTRY. Set it to an address reachable by the runner and every Kubernetes node." >&2
            exit 1
          fi

          if [[ "$NEXUS_DOCKER_REGISTRY" =~ ^(127\.|localhost:|0\.0\.0\.0:) ]]; then
            echo "NEXUS_DOCKER_REGISTRY must be node-reachable for multi-node clusters. Do not use loopback: $NEXUS_DOCKER_REGISTRY" >&2
            exit 1
          fi

          NEXUS_ADMIN_PASSWORD="${NEXUS_ADMIN_PASSWORD:-${NEXUS_ADMIN_PASSWORD_SECRET:-admin123}}"

          echo "CI_CD_NAMESPACE=${{ needs.prepare.outputs.ci_cd_namespace }}" >> "$GITHUB_ENV"
          echo "NEXUS_DOCKER_REGISTRY=$NEXUS_DOCKER_REGISTRY" >> "$GITHUB_ENV"
          echo "NEXUS_ADMIN_PASSWORD=$NEXUS_ADMIN_PASSWORD" >> "$GITHUB_ENV"
          echo "NEXUS_HTTP_NODE_PORT=${NEXUS_HTTP_NODE_PORT:-31328}" >> "$GITHUB_ENV"
          echo "NEXUS_DOCKER_NODE_PORT=${NEXUS_DOCKER_NODE_PORT:-30500}" >> "$GITHUB_ENV"
        env:
          NEXUS_ADMIN_PASSWORD_SECRET: ${{ secrets.NEXUS_ADMIN_PASSWORD }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          if [[ -f "$HOME/.kube/config" ]] && kubectl config current-context >/dev/null 2>&1; then
            echo "Using existing runner kubeconfig at $HOME/.kube/config"
          elif [[ -f "$HOME/.config/k3d/kubeconfig-${K3D_CLUSTER:-eco-cluster}.yaml" ]]; then
            cp "$HOME/.config/k3d/kubeconfig-${K3D_CLUSTER:-eco-cluster}.yaml" "$HOME/.kube/config"
          elif command -v k3d >/dev/null 2>&1 && k3d cluster list "${K3D_CLUSTER:-eco-cluster}" >/dev/null 2>&1; then
            k3d kubeconfig get "${K3D_CLUSTER:-eco-cluster}" > "$HOME/.kube/config"
          elif [[ -f /etc/rancher/k3s/k3s.yaml ]]; then
            sudo cat /etc/rancher/k3s/k3s.yaml > "$HOME/.kube/config"
          elif [[ -n "${KUBE_CONFIG_B64:-}" ]]; then
            echo "$KUBE_CONFIG_B64" | base64 --decode > "$HOME/.kube/config"
          else
            echo "No usable kubeconfig found. Add one at $HOME/.kube/config on the runner, install k3s config at /etc/rancher/k3s/k3s.yaml, or set KUBE_CONFIG_B64." >&2
            exit 1
          fi
          chmod 600 "$HOME/.kube/config"
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}

      - name: Create CI/CD namespace
        shell: bash
        run: |
          if ! kubectl create namespace "$CI_CD_NAMESPACE" 2>namespace-error.log; then
            if grep -q "AlreadyExists" namespace-error.log; then
              echo "Namespace $CI_CD_NAMESPACE already exists"
            else
              cat namespace-error.log >&2
              exit 1
            fi
          fi

      - name: Build Helm dependencies
        shell: bash
        run: |
          helm dependency build ci-cd/nexus/deployment
          helm dependency build ci-cd/deployment

      - name: Deploy Nexus
        shell: bash
        run: |
          helm upgrade --install ci-cd ci-cd/deployment \
            --namespace "$CI_CD_NAMESPACE" \
            --wait \
            --set nexus.app.service.ports[0].name=http \
            --set nexus.app.service.ports[0].port=8081 \
            --set nexus.app.service.ports[0].targetPort=http \
            --set nexus.app.service.ports[0].protocol=TCP \
            --set nexus.app.service.ports[0].nodePort="$NEXUS_HTTP_NODE_PORT" \
            --set nexus.app.service.ports[1].name=docker \
            --set nexus.app.service.ports[1].port=5000 \
            --set nexus.app.service.ports[1].targetPort=docker \
            --set nexus.app.service.ports[1].protocol=TCP \
            --set nexus.app.service.ports[1].nodePort="$NEXUS_DOCKER_NODE_PORT"

      - name: Configure k3d node registry mirrors
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v docker >/dev/null 2>&1; then
            echo "Docker is not available; skipping k3d registry mirror configuration"
            exit 0
          fi

          K3D_CLUSTER_NAME="${K3D_CLUSTER:-eco-cluster}"
          mapfile -t K3D_NODES < <(docker ps \
            --filter "name=k3d-${K3D_CLUSTER_NAME}-" \
            --format '{{.Names}}' \
            | grep -E '^k3d-.+-(server|agent)-[0-9]+$' || true)

          if [[ "${#K3D_NODES[@]}" -eq 0 ]]; then
            echo "No k3d node containers found; skipping registry mirror configuration"
            exit 0
          fi

          for node in "${K3D_NODES[@]}"; do
            echo "Configuring registry mirror on $node"
            docker exec "$node" sh -c "mkdir -p /etc/rancher/k3s && printf '%s\n' \
              'mirrors:' \
              '  \"${NEXUS_DOCKER_REGISTRY}\":' \
              '    endpoint:' \
              '      - \"http://${NEXUS_DOCKER_REGISTRY}\"' \
              > /etc/rancher/k3s/registries.yaml"
          done

          for node in "${K3D_NODES[@]}"; do
            docker restart "$node"
          done

          kubectl wait --for=condition=Ready nodes --all --timeout=180s

      - name: Configure Nexus Docker repository
        shell: bash
        run: |
          set -euo pipefail

          show_nexus_status() {
            echo "::group::Nexus resources"
            kubectl get pods,deploy,svc,pvc -n "$CI_CD_NAMESPACE" -l app.kubernetes.io/name=nexus || true
            echo "::endgroup::"
            echo "::group::Recent Nexus logs"
            kubectl logs -n "$CI_CD_NAMESPACE" deployment/nexus --tail=120 || true
            echo "::endgroup::"
          }

          kubectl rollout status deployment/nexus -n "$CI_CD_NAMESPACE" --timeout=600s
          kubectl wait --for=condition=Ready pod \
            -n "$CI_CD_NAMESPACE" \
            -l app.kubernetes.io/name=nexus,app.kubernetes.io/instance=ci-cd \
            --timeout=600s

          NEXUS_HTTP_URL="${NEXUS_HTTP_URL:-http://${NEXUS_DOCKER_REGISTRY%:*}:${NEXUS_HTTP_NODE_PORT:-31328}}"
          trap 'show_nexus_status' EXIT

          for attempt in {1..90}; do
            if curl --silent --fail "$NEXUS_HTTP_URL/service/rest/v1/status" >/dev/null; then
              break
            fi

            if [[ "$attempt" == "90" ]]; then
              echo "Timed out waiting for Nexus REST API" >&2
              exit 1
            fi

            sleep 2
          done

          curl --silent --fail --user "admin:$NEXUS_ADMIN_PASSWORD" \
            "$NEXUS_HTTP_URL/service/rest/v1/system/eula" \
            | jq '.accepted = true' > nexus-eula-accepted.json

          curl --silent --fail --user "admin:$NEXUS_ADMIN_PASSWORD" \
            --request POST \
            --header "Content-Type: application/json" \
            --data-binary @nexus-eula-accepted.json \
            "$NEXUS_HTTP_URL/service/rest/v1/system/eula"

          curl --silent --fail --user "admin:$NEXUS_ADMIN_PASSWORD" \
            "$NEXUS_HTTP_URL/service/rest/v1/security/realms/active" \
            | jq 'if index("DockerToken") then . else . + ["DockerToken"] end' > nexus-active-realms.json

          curl --silent --fail --user "admin:$NEXUS_ADMIN_PASSWORD" \
            --request PUT \
            --header "Content-Type: application/json" \
            --data-binary @nexus-active-realms.json \
            "$NEXUS_HTTP_URL/service/rest/v1/security/realms/active"

          if curl --silent --fail --user "admin:$NEXUS_ADMIN_PASSWORD" \
            "$NEXUS_HTTP_URL/service/rest/v1/repositories/docker/hosted/eco-images" >/dev/null; then
            echo "Nexus Docker repository eco-images already exists"
          else
            curl --silent --fail --user "admin:$NEXUS_ADMIN_PASSWORD" \
              --request POST \
              --header "Content-Type: application/json" \
              --data '{
                "name": "eco-images",
                "online": true,
                "storage": {
                  "blobStoreName": "default",
                  "strictContentTypeValidation": true,
                  "writePolicy": "ALLOW"
                },
                "cleanup": {
                  "policyNames": []
                },
                "docker": {
                  "v1Enabled": false,
                  "forceBasicAuth": true,
                  "httpPort": 5000
                },
                "component": {
                  "proprietaryComponents": false
                }
              }' \
              "$NEXUS_HTTP_URL/service/rest/v1/repositories/docker/hosted"
          fi

          if curl --silent --fail --user "admin:$NEXUS_ADMIN_PASSWORD" \
            "$NEXUS_HTTP_URL/service/rest/v1/repositories/raw/hosted/eco-node-builds" >/dev/null; then
            echo "Nexus raw repository eco-node-builds already exists"
          else
            curl --silent --fail --user "admin:$NEXUS_ADMIN_PASSWORD" \
              --request POST \
              --header "Content-Type: application/json" \
              --data '{
                "name": "eco-node-builds",
                "online": true,
                "storage": {
                  "blobStoreName": "default",
                  "strictContentTypeValidation": false,
                  "writePolicy": "ALLOW"
                },
                "cleanup": {
                  "policyNames": []
                },
                "component": {
                  "proprietaryComponents": false
                },
                "raw": {
                  "contentDisposition": "ATTACHMENT"
                }
              }' \
              "$NEXUS_HTTP_URL/service/rest/v1/repositories/raw/hosted"
          fi

      - name: Show CI/CD rollout
        shell: bash
        run: |
          kubectl get all -n "$CI_CD_NAMESPACE"

  foundation:
    name: Deploy foundation
    needs:
      - prepare
      - ci_cd
    if: always() && needs.prepare.outputs.deploy_foundation == 'true' && (needs.ci_cd.result == 'success' || needs.ci_cd.result == 'skipped')
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load environment config
        shell: bash
        run: |
          set -euo pipefail
          set -a
          . "config/${ENVIRONMENT_FILE}"
          set +a
          if [[ -z "${NEXUS_DOCKER_REGISTRY:-}" ]]; then
            echo "Missing NEXUS_DOCKER_REGISTRY. Set it to an address reachable by the runner and every Kubernetes node." >&2
            exit 1
          fi

          if [[ "$NEXUS_DOCKER_REGISTRY" =~ ^(127\.|localhost:|0\.0\.0\.0:) ]]; then
            echo "NEXUS_DOCKER_REGISTRY must be node-reachable for multi-node clusters. Do not use loopback: $NEXUS_DOCKER_REGISTRY" >&2
            exit 1
          fi

          IMAGE_NAMESPACE="${IMAGE_NAMESPACE:-eco-system}"
          IMAGE_PREFIX="${IMAGE_PREFIX:-$NEXUS_DOCKER_REGISTRY/$IMAGE_NAMESPACE}"
          NEXUS_ADMIN_PASSWORD="${NEXUS_ADMIN_PASSWORD:-${NEXUS_ADMIN_PASSWORD_SECRET:-admin123}}"

          echo "FOUNDATION_NAMESPACE=${{ needs.prepare.outputs.foundation_namespace }}" >> "$GITHUB_ENV"
          echo "NEXUS_DOCKER_REGISTRY=$NEXUS_DOCKER_REGISTRY" >> "$GITHUB_ENV"
          echo "IMAGE_PREFIX=$IMAGE_PREFIX" >> "$GITHUB_ENV"
          echo "NEXUS_ADMIN_PASSWORD=$NEXUS_ADMIN_PASSWORD" >> "$GITHUB_ENV"
          echo "POSTGRES_DB=${POSTGRES_DB:-ecoDB}" >> "$GITHUB_ENV"
          echo "LIQUIBASE_JDBC_URL=${LIQUIBASE_JDBC_URL:-jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ecoDB}}" >> "$GITHUB_ENV"
          echo "POSTGRES_LIQUIBASE_USER=${POSTGRES_LIQUIBASE_USER:-liquibase}" >> "$GITHUB_ENV"
        env:
          NEXUS_ADMIN_PASSWORD_SECRET: ${{ secrets.NEXUS_ADMIN_PASSWORD }}

      - name: Configure Docker insecure registry
        shell: bash
        run: |
          set -euo pipefail

          if docker info 2>/dev/null | grep -F "$NEXUS_DOCKER_REGISTRY" >/dev/null; then
            echo "Docker already trusts insecure registry $NEXUS_DOCKER_REGISTRY"
            exit 0
          fi

          if ! sudo -n true 2>/dev/null; then
            echo "Docker must be configured to trust HTTP registry $NEXUS_DOCKER_REGISTRY before images can be pushed." >&2
            echo "Either preconfigure /etc/docker/daemon.json on the self-hosted runner or allow passwordless sudo for the runner user." >&2
            exit 1
          fi

          sudo mkdir -p /etc/docker
          if [[ -f /etc/docker/daemon.json ]]; then
            sudo cp /etc/docker/daemon.json /tmp/docker-daemon.json
          else
            printf '{}\n' > /tmp/docker-daemon.json
          fi

          python3 - "$NEXUS_DOCKER_REGISTRY" /tmp/docker-daemon.json <<'PY'
          import json
          import sys

          registry = sys.argv[1]
          path = sys.argv[2]

          with open(path, "r", encoding="utf-8") as fh:
              config = json.load(fh)

          registries = config.setdefault("insecure-registries", [])
          if registry not in registries:
              registries.append(registry)

          with open(path, "w", encoding="utf-8") as fh:
              json.dump(config, fh, indent=2)
              fh.write("\n")
          PY

          sudo cp /tmp/docker-daemon.json /etc/docker/daemon.json
          sudo systemctl restart docker || sudo service docker restart
          docker info

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build liquibase image
        shell: bash
        run: |
          docker build \
            -f foundation/liquibase/dockerfile \
            -t "$IMAGE_PREFIX/liquibase:$IMAGE_TAG" \
            foundation/liquibase

      - name: Push liquibase image to Nexus
        shell: bash
        run: |
          echo "$NEXUS_ADMIN_PASSWORD" | docker login "$NEXUS_DOCKER_REGISTRY" --username admin --password-stdin
          docker push "$IMAGE_PREFIX/liquibase:$IMAGE_TAG"

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          if [[ -f "$HOME/.kube/config" ]] && kubectl config current-context >/dev/null 2>&1; then
            echo "Using existing runner kubeconfig at $HOME/.kube/config"
          elif [[ -f "$HOME/.config/k3d/kubeconfig-${K3D_CLUSTER:-eco-cluster}.yaml" ]]; then
            cp "$HOME/.config/k3d/kubeconfig-${K3D_CLUSTER:-eco-cluster}.yaml" "$HOME/.kube/config"
          elif command -v k3d >/dev/null 2>&1 && k3d cluster list "${K3D_CLUSTER:-eco-cluster}" >/dev/null 2>&1; then
            k3d kubeconfig get "${K3D_CLUSTER:-eco-cluster}" > "$HOME/.kube/config"
          elif [[ -f /etc/rancher/k3s/k3s.yaml ]]; then
            sudo cat /etc/rancher/k3s/k3s.yaml > "$HOME/.kube/config"
          elif [[ -n "${KUBE_CONFIG_B64:-}" ]]; then
            echo "$KUBE_CONFIG_B64" | base64 --decode > "$HOME/.kube/config"
          else
            echo "No usable kubeconfig found. Add one at $HOME/.kube/config on the runner, install k3s config at /etc/rancher/k3s/k3s.yaml, or set KUBE_CONFIG_B64." >&2
            exit 1
          fi
          chmod 600 "$HOME/.kube/config"
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}

      - name: Check Kubernetes API
        shell: bash
        run: |
          set -euo pipefail
          kubectl config current-context
          echo "Kubernetes server: $(kubectl config view --minify --raw -o jsonpath='{.clusters[0].cluster.server}')"
          kubectl version --client
          kubectl get --raw=/version
          kubectl get --raw=/api

      - name: Create foundation namespace
        shell: bash
        run: |
          if ! kubectl create namespace "$FOUNDATION_NAMESPACE" 2>namespace-error.log; then
            if grep -q "AlreadyExists" namespace-error.log; then
              echo "Namespace $FOUNDATION_NAMESPACE already exists"
            else
              cat namespace-error.log >&2
              exit 1
            fi
          fi

      - name: Create Nexus image pull secret
        shell: bash
        run: |
          kubectl create secret docker-registry nexus-docker-registry \
            --docker-server="$NEXUS_DOCKER_REGISTRY" \
            --docker-username=admin \
            --docker-password="$NEXUS_ADMIN_PASSWORD" \
            --dry-run=client \
            -o yaml \
            | kubectl apply -n "$FOUNDATION_NAMESPACE" -f -

      - name: Build Helm dependencies
        shell: bash
        run: |
          helm dependency build foundation/postgres/deployment
          helm dependency build foundation/liquibase/deployment
          helm dependency build foundation/minio/deployment
          helm dependency build foundation/deployment

      - name: Deploy foundation services
        shell: bash
        run: |
          POSTGRES_PASSWORD="${POSTGRES_PASSWORD:-${{ secrets.POSTGRES_PASSWORD }}}"
          LIQUIBASE_PASSWORD="${LIQUIBASE_PASSWORD:-${{ secrets.LIQUIBASE_PASSWORD }}}"
          APP_PASSWORD="${APP_PASSWORD:-${{ secrets.APP_PASSWORD }}}"

          if [[ -z "$POSTGRES_PASSWORD" || -z "$LIQUIBASE_PASSWORD" || -z "$APP_PASSWORD" ]]; then
            echo "Missing required credentials for foundation deploy. Set POSTGRES_PASSWORD, LIQUIBASE_PASSWORD, APP_PASSWORD in environment or GitHub secrets." >&2
            exit 1
          fi

          helm upgrade --install foundation foundation/deployment \
            --namespace "$FOUNDATION_NAMESPACE" \
            --wait --wait-for-jobs \
            --set postgres.app.env.POSTGRES_DB="$POSTGRES_DB" \
            --set liquibase.app.image.repository="$IMAGE_PREFIX/liquibase" \
            --set liquibase.app.image.tag="$IMAGE_TAG" \
            --set liquibase.app.image.pullPolicy=IfNotPresent \
            --set liquibase.app.imagePullSecrets[0].name=nexus-docker-registry \
            --set-string liquibase.app.env.LIQUIBASE_COMMAND_URL="$LIQUIBASE_JDBC_URL" \
            --set-string liquibase.app.env.LIQUIBASE_COMMAND_USERNAME="$POSTGRES_LIQUIBASE_USER" \
            --set-string postgres.app.secret.stringData.POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --set-string postgres.app.secret.stringData.LIQUIBASE_PASSWORD="$LIQUIBASE_PASSWORD" \
            --set-string postgres.app.secret.stringData.APP_PASSWORD="$APP_PASSWORD" \
            --set-string liquibase.app.secret.stringData.LIQUIBASE_COMMAND_PASSWORD="$LIQUIBASE_PASSWORD" \
            --set-string liquibase.app.secret.stringData.LIQUIBASE_PASSWORD="$LIQUIBASE_PASSWORD"

      - name: Run deployed foundation smoke tests
        shell: bash
        run: |
          set -euo pipefail

          show_foundation_logs() {
            echo "::group::Recent postgres logs"
            kubectl logs -n "$FOUNDATION_NAMESPACE" deployment/postgres --tail=120 || true
            echo "::endgroup::"
            echo "::group::Recent minio logs"
            kubectl logs -n "$FOUNDATION_NAMESPACE" deployment/minio --tail=120 || true
            echo "::endgroup::"
          }

          kubectl rollout status deployment/postgres -n "$FOUNDATION_NAMESPACE" --timeout=180s
          kubectl rollout status deployment/minio -n "$FOUNDATION_NAMESPACE" --timeout=180s

          kubectl port-forward -n "$FOUNDATION_NAMESPACE" service/minio 19000:9000 &
          MINIO_PORT_FORWARD_PID="$!"
          trap 'kill "$MINIO_PORT_FORWARD_PID" 2>/dev/null || true; show_foundation_logs' EXIT

          for attempt in {1..30}; do
            if kubectl exec -n "$FOUNDATION_NAMESPACE" deployment/postgres -- pg_isready -U postgres >/dev/null 2>&1 \
              && curl --silent --fail http://127.0.0.1:19000/minio/health/ready >/dev/null; then
              break
            fi

            if [[ "$attempt" == "30" ]]; then
              echo "Timed out waiting for port-forwarded foundation services" >&2
              exit 1
            fi

            sleep 1
          done

      - name: Show foundation rollout
        shell: bash
        run: |
          kubectl get all -n "$FOUNDATION_NAMESPACE"

  application:
    name: Build and deploy application
    needs:
      - prepare
      - ci_cd
      - foundation
    if: always() && needs.prepare.outputs.deploy_application == 'true' && (needs.ci_cd.result == 'success' || needs.ci_cd.result == 'skipped') && (needs.foundation.result == 'success' || needs.foundation.result == 'skipped')
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load environment config
        shell: bash
        run: |
          set -euo pipefail
          set -a
          . "config/${ENVIRONMENT_FILE}"
          set +a

          if [[ -z "${NEXUS_DOCKER_REGISTRY:-}" ]]; then
            echo "Missing NEXUS_DOCKER_REGISTRY. Set it to an address reachable by the runner and every Kubernetes node." >&2
            exit 1
          fi

          if [[ "$NEXUS_DOCKER_REGISTRY" =~ ^(127\.|localhost:|0\.0\.0\.0:) ]]; then
            echo "NEXUS_DOCKER_REGISTRY must be node-reachable for multi-node clusters. Do not use loopback: $NEXUS_DOCKER_REGISTRY" >&2
            exit 1
          fi

          IMAGE_NAMESPACE="${IMAGE_NAMESPACE:-eco-system}"
          IMAGE_PREFIX="${IMAGE_PREFIX:-$NEXUS_DOCKER_REGISTRY/$IMAGE_NAMESPACE}"
          NEXUS_ADMIN_PASSWORD="${NEXUS_ADMIN_PASSWORD:-${NEXUS_ADMIN_PASSWORD_SECRET:-admin123}}"
          UNCHANGED_APPLICATION_IMAGE_TAG="latest"

          USER_MANAGEMENT_IMAGE_TAG="$UNCHANGED_APPLICATION_IMAGE_TAG"
          PRODUCT_MANAGEMENT_IMAGE_TAG="$UNCHANGED_APPLICATION_IMAGE_TAG"
          ORDER_MANAGEMENT_IMAGE_TAG="$UNCHANGED_APPLICATION_IMAGE_TAG"
          ONLINE_STOREFRONT_IMAGE_TAG="$UNCHANGED_APPLICATION_IMAGE_TAG"
          STORYBOOK_IMAGE_TAG="$UNCHANGED_APPLICATION_IMAGE_TAG"

          if [[ "${{ needs.prepare.outputs.build_user_management }}" == "true" ]]; then
            USER_MANAGEMENT_IMAGE_TAG="$IMAGE_TAG"
          fi
          if [[ "${{ needs.prepare.outputs.build_product_management }}" == "true" ]]; then

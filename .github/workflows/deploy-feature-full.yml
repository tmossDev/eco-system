          fi
          if [[ "${{ needs.prepare.outputs.build_product_management }}" == "true" ]]; then
            docker build \
              -f dockerfile \
              --build-arg APP_NAME=product-service \
              -t "$IMAGE_PREFIX/product-service:$IMAGE_TAG" \
              .
            docker build \
              -f dockerfile \
              --build-arg APP_NAME=product-gateway \
              -t "$IMAGE_PREFIX/product-gateway:$IMAGE_TAG" \
              .
            docker build \
              -f product-management/frontend/app/product-admin-web-app/Dockerfile \
              -t "$IMAGE_PREFIX/product-admin-web-app:$IMAGE_TAG" \
              .
          fi
          if [[ "${{ needs.prepare.outputs.build_order_management }}" == "true" ]]; then
            docker build \
              -f dockerfile \
              --build-arg APP_NAME=order-service \
              -t "$IMAGE_PREFIX/order-service:$IMAGE_TAG" \
              .
            docker build \
              -f dockerfile \
              --build-arg APP_NAME=order-gateway \
              -t "$IMAGE_PREFIX/order-gateway:$IMAGE_TAG" \
              .
            docker build \
              -f order-management/frontend/app/order-admin-web-app/Dockerfile \
              -t "$IMAGE_PREFIX/order-admin-web-app:$IMAGE_TAG" \

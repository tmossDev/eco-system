          fi

          APP_PASSWORD="${APP_PASSWORD:-${{ secrets.APP_PASSWORD }}}"
          if [[ -z "$APP_PASSWORD" ]]; then
            echo "Missing APP_PASSWORD for application deploy. Set APP_PASSWORD in environment or GitHub secrets." >&2
            exit 1
          fi

          echo "NAMESPACE=${{ needs.prepare.outputs.namespace }}" >> "$GITHUB_ENV"
          echo "CI_CD_NAMESPACE=${{ needs.prepare.outputs.ci_cd_namespace }}" >> "$GITHUB_ENV"
          echo "FOUNDATION_NAMESPACE=${{ needs.prepare.outputs.foundation_namespace }}" >> "$GITHUB_ENV"
          echo "K3D_CLUSTER=${K3D_CLUSTER:-eco-cluster}" >> "$GITHUB_ENV"
          echo "NEXUS_DOCKER_REGISTRY=$NEXUS_DOCKER_REGISTRY" >> "$GITHUB_ENV"
          echo "IMAGE_PREFIX=$IMAGE_PREFIX" >> "$GITHUB_ENV"
          echo "NEXUS_ADMIN_PASSWORD=$NEXUS_ADMIN_PASSWORD" >> "$GITHUB_ENV"
          echo "USER_MANAGEMENT_IMAGE_TAG=$USER_MANAGEMENT_IMAGE_TAG" >> "$GITHUB_ENV"
          echo "PRODUCT_MANAGEMENT_IMAGE_TAG=$PRODUCT_MANAGEMENT_IMAGE_TAG" >> "$GITHUB_ENV"
          echo "ORDER_MANAGEMENT_IMAGE_TAG=$ORDER_MANAGEMENT_IMAGE_TAG" >> "$GITHUB_ENV"
          echo "ONLINE_STOREFRONT_IMAGE_TAG=$ONLINE_STOREFRONT_IMAGE_TAG" >> "$GITHUB_ENV"
          echo "STORYBOOK_IMAGE_TAG=$STORYBOOK_IMAGE_TAG" >> "$GITHUB_ENV"
          echo "POSTGRES_DB=${POSTGRES_DB:-ecoDB}" >> "$GITHUB_ENV"
          echo "POSTGRES_HOST=${POSTGRES_HOST:-postgres.${{ needs.prepare.outputs.foundation_namespace }}.svc.cluster.local}" >> "$GITHUB_ENV"
          echo "POSTGRES_PORT=${POSTGRES_PORT:-5432}" >> "$GITHUB_ENV"
          echo "POSTGRES_APP_USER=${POSTGRES_APP_USER:-app_user}" >> "$GITHUB_ENV"
          echo "APP_PASSWORD=$APP_PASSWORD" >> "$GITHUB_ENV"
          echo "USER_SERVICE_INTERNAL_URL=${USER_SERVICE_INTERNAL_URL:-http://user-service:8080}" >> "$GITHUB_ENV"
          echo "PRODUCT_SERVICE_INTERNAL_URL=${PRODUCT_SERVICE_INTERNAL_URL:-http://product-service:8080}" >> "$GITHUB_ENV"
          echo "PRODUCT_GATEWAY_INTERNAL_URL=${PRODUCT_GATEWAY_INTERNAL_URL:-http://product-gateway:8080}" >> "$GITHUB_ENV"
          echo "INGRESS_CLASS_NAME=${INGRESS_CLASS_NAME:-traefik}" >> "$GITHUB_ENV"
          INGRESS_SCHEME="${INGRESS_SCHEME:-http}"
          if [[ -n "${INGRESS_TLS_SECRET_NAME:-}" && "$INGRESS_SCHEME" == "http" ]]; then
            INGRESS_SCHEME=https
          fi
          echo "INGRESS_TLS_SECRET_NAME=${INGRESS_TLS_SECRET_NAME:-}" >> "$GITHUB_ENV"
          echo "INGRESS_SCHEME=$INGRESS_SCHEME" >> "$GITHUB_ENV"
          echo "DEFAULT_APPLICATION_NAMESPACE=${DEFAULT_APPLICATION_NAMESPACE:-eco-test}" >> "$GITHUB_ENV"
          echo "ADMIN_WEB_APP_HOST=${{ needs.prepare.outputs.admin_web_app_host }}" >> "$GITHUB_ENV"
          echo "USER_GATEWAY_HOST=${{ needs.prepare.outputs.user_gateway_host }}" >> "$GITHUB_ENV"
          echo "USER_SERVICE_HOST=${{ needs.prepare.outputs.user_service_host }}" >> "$GITHUB_ENV"
          echo "PRODUCT_ADMIN_WEB_APP_HOST=${{ needs.prepare.outputs.product_admin_web_app_host }}" >> "$GITHUB_ENV"
          echo "PRODUCT_GATEWAY_HOST=${{ needs.prepare.outputs.product_gateway_host }}" >> "$GITHUB_ENV"
          echo "PRODUCT_SERVICE_HOST=${{ needs.prepare.outputs.product_service_host }}" >> "$GITHUB_ENV"
          echo "ORDER_ADMIN_WEB_APP_HOST=${{ needs.prepare.outputs.order_admin_web_app_host }}" >> "$GITHUB_ENV"
          echo "ORDER_GATEWAY_HOST=${{ needs.prepare.outputs.order_gateway_host }}" >> "$GITHUB_ENV"
          echo "ORDER_SERVICE_HOST=${{ needs.prepare.outputs.order_service_host }}" >> "$GITHUB_ENV"
          echo "STOREFRONT_WEB_APP_HOST=${{ needs.prepare.outputs.storefront_web_app_host }}" >> "$GITHUB_ENV"
          echo "STORYBOOK_HOST=${{ needs.prepare.outputs.storybook_host }}" >> "$GITHUB_ENV"
          echo "BACKEND_API_URL=" >> "$GITHUB_ENV"
          echo "PRODUCT_BACKEND_API_URL=" >> "$GITHUB_ENV"
          echo "ORDER_BACKEND_API_URL=" >> "$GITHUB_ENV"
          echo "FRONTEND_ORIGIN=$INGRESS_SCHEME://${{ needs.prepare.outputs.admin_web_app_host }}" >> "$GITHUB_ENV"
          echo "PRODUCT_FRONTEND_ORIGIN=$INGRESS_SCHEME://${{ needs.prepare.outputs.product_admin_web_app_host }}" >> "$GITHUB_ENV"
          echo "ORDER_FRONTEND_ORIGIN=$INGRESS_SCHEME://${{ needs.prepare.outputs.order_admin_web_app_host }}" >> "$GITHUB_ENV"
          echo "STOREFRONT_FRONTEND_ORIGIN=$INGRESS_SCHEME://${{ needs.prepare.outputs.storefront_web_app_host }}" >> "$GITHUB_ENV"
        env:
          NEXUS_ADMIN_PASSWORD_SECRET: ${{ secrets.NEXUS_ADMIN_PASSWORD }}

      - name: Set up Go
        if: needs.prepare.outputs.deploy_user_management == 'true' || needs.prepare.outputs.deploy_product_management == 'true' || needs.prepare.outputs.deploy_order_management == 'true' || needs.prepare.outputs.deploy_online_storefront == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod


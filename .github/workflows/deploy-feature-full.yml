      - name: Push application images to Nexus
        if: needs.prepare.outputs.build_user_management == 'true' || needs.prepare.outputs.build_product_management == 'true' || needs.prepare.outputs.build_order_management == 'true' || needs.prepare.outputs.build_online_storefront == 'true' || needs.prepare.outputs.build_storybook == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "$NEXUS_ADMIN_PASSWORD" | docker login "$NEXUS_DOCKER_REGISTRY" --username admin --password-stdin
          push_image() {
            local name="$1"
            docker push "$IMAGE_PREFIX/$name:$IMAGE_TAG"
            if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
              docker tag "$IMAGE_PREFIX/$name:$IMAGE_TAG" "$IMAGE_PREFIX/$name:latest"
              docker push "$IMAGE_PREFIX/$name:latest"
            fi
          }

          if [[ "${{ needs.prepare.outputs.build_user_management }}" == "true" ]]; then
            push_image user-service
            push_image user-gateway
            push_image admin-web-app
          fi
          if [[ "${{ needs.prepare.outputs.build_product_management }}" == "true" ]]; then
            push_image product-service
            push_image product-gateway
            push_image product-admin-web-app
          fi
          if [[ "${{ needs.prepare.outputs.build_order_management }}" == "true" ]]; then
            push_image order-service
            push_image order-gateway
            push_image order-admin-web-app
          fi
          if [[ "${{ needs.prepare.outputs.build_online_storefront }}" == "true" ]]; then
            push_image cart-gateway
            push_image storefront-gateway
            push_image storefront-web-app
          fi
          if [[ "${{ needs.prepare.outputs.build_storybook }}" == "true" ]]; then
            push_image storybook
          fi

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          if [[ -f "$HOME/.kube/config" ]] && kubectl config current-context >/dev/null 2>&1; then
            echo "Using existing runner kubeconfig at $HOME/.kube/config"
          elif [[ -f "$HOME/.config/k3d/kubeconfig-${K3D_CLUSTER:-eco-cluster}.yaml" ]]; then
            cp "$HOME/.config/k3d/kubeconfig-${K3D_CLUSTER:-eco-cluster}.yaml" "$HOME/.kube/config"
          elif command -v k3d >/dev/null 2>&1 && k3d cluster list "${K3D_CLUSTER:-eco-cluster}" >/dev/null 2>&1; then
            k3d kubeconfig get "${K3D_CLUSTER:-eco-cluster}" > "$HOME/.kube/config"
          elif [[ -f /etc/rancher/k3s/k3s.yaml ]]; then
            sudo cat /etc/rancher/k3s/k3s.yaml > "$HOME/.kube/config"
          elif [[ -n "${KUBE_CONFIG_B64:-}" ]]; then
            echo "$KUBE_CONFIG_B64" | base64 --decode > "$HOME/.kube/config"
          else
            echo "No usable kubeconfig found. Add one at $HOME/.kube/config on the runner, install k3s config at /etc/rancher/k3s/k3s.yaml, or set KUBE_CONFIG_B64." >&2
            exit 1
          fi
          chmod 600 "$HOME/.kube/config"
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}

      - name: Check Kubernetes API
        shell: bash
        run: |
          set -euo pipefail
          kubectl config current-context
          echo "Kubernetes server: $(kubectl config view --minify --raw -o jsonpath='{.clusters[0].cluster.server}')"
          kubectl version --client
          kubectl get --raw=/version
          kubectl get --raw=/api

      - name: Create application namespace

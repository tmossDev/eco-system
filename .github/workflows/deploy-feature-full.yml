        if: needs.prepare.outputs.build_user_management == 'true' || needs.prepare.outputs.build_product_management == 'true' || needs.prepare.outputs.build_order_management == 'true' || needs.prepare.outputs.build_online_storefront == 'true' || needs.prepare.outputs.build_storybook == 'true'
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig for Nexus artifacts
        if: needs.prepare.outputs.build_user_management == 'true' || needs.prepare.outputs.build_product_management == 'true' || needs.prepare.outputs.build_order_management == 'true' || needs.prepare.outputs.build_online_storefront == 'true' || needs.prepare.outputs.build_storybook == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          if [[ -f "$HOME/.kube/config" ]] && kubectl config current-context >/dev/null 2>&1; then
            echo "Using existing runner kubeconfig at $HOME/.kube/config"
          elif [[ -f "$HOME/.config/k3d/kubeconfig-${K3D_CLUSTER:-eco-cluster}.yaml" ]]; then
            cp "$HOME/.config/k3d/kubeconfig-${K3D_CLUSTER:-eco-cluster}.yaml" "$HOME/.kube/config"
          elif command -v k3d >/dev/null 2>&1 && k3d cluster list "${K3D_CLUSTER:-eco-cluster}" >/dev/null 2>&1; then
            k3d kubeconfig get "${K3D_CLUSTER:-eco-cluster}" > "$HOME/.kube/config"
          elif [[ -f /etc/rancher/k3s/k3s.yaml ]]; then
            sudo cat /etc/rancher/k3s/k3s.yaml > "$HOME/.kube/config"
          elif [[ -n "${KUBE_CONFIG_B64:-}" ]]; then
            echo "$KUBE_CONFIG_B64" | base64 --decode > "$HOME/.kube/config"
          else
            echo "No usable kubeconfig found. Add one at $HOME/.kube/config on the runner, install k3s config at /etc/rancher/k3s/k3s.yaml, or set KUBE_CONFIG_B64." >&2
            exit 1
          fi
          chmod 600 "$HOME/.kube/config"
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}

      - name: Build backend binaries
        if: needs.prepare.outputs.build_user_management == 'true' || needs.prepare.outputs.build_product_management == 'true' || needs.prepare.outputs.build_order_management == 'true' || needs.prepare.outputs.build_online_storefront == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/bin
          built_bins=()
          if [[ "${{ needs.prepare.outputs.build_user_management }}" == "true" ]]; then
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o build/bin/user-service ./user-management/backend/app/user-service/cmd
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o build/bin/user-gateway ./user-management/backend/app/user-gateway/cmd
            built_bins+=(build/bin/user-service build/bin/user-gateway)
          fi
          if [[ "${{ needs.prepare.outputs.build_product_management }}" == "true" ]]; then
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o build/bin/product-service ./product-management/backend/app/product-service/cmd
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o build/bin/product-gateway ./product-management/backend/app/product-gateway/cmd
            built_bins+=(build/bin/product-service build/bin/product-gateway)
          fi
          if [[ "${{ needs.prepare.outputs.build_order_management }}" == "true" ]]; then
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o build/bin/order-service ./order-management/backend/app/order-service/cmd
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o build/bin/order-gateway ./order-management/backend/app/order-gateway/cmd
            built_bins+=(build/bin/order-service build/bin/order-gateway)
          fi
          if [[ "${{ needs.prepare.outputs.build_online_storefront }}" == "true" ]]; then
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o build/bin/cart-gateway ./online-storefront/backend/app/cart-gateway/cmd
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o build/bin/storefront-gateway ./online-storefront/backend/app/storefront-gateway/cmd
            built_bins+=(build/bin/cart-gateway build/bin/storefront-gateway)
          fi
          file "${built_bins[@]}"

      - name: Build frontend applications and storybooks
        if: needs.prepare.outputs.build_user_management == 'true' || needs.prepare.outputs.build_product_management == 'true' || needs.prepare.outputs.build_order_management == 'true' || needs.prepare.outputs.build_online_storefront == 'true' || needs.prepare.outputs.build_storybook == 'true'
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          artifacts=()
          if [[ "${{ needs.prepare.outputs.build_user_management }}" == "true" ]]; then
            artifacts+=(admin-web-app)
          fi
          if [[ "${{ needs.prepare.outputs.build_product_management }}" == "true" ]]; then
            artifacts+=(product-admin-web-app)
          fi
          if [[ "${{ needs.prepare.outputs.build_order_management }}" == "true" ]]; then
            artifacts+=(order-admin-web-app)
          fi
          if [[ "${{ needs.prepare.outputs.build_online_storefront }}" == "true" ]]; then
            artifacts+=(storefront-web-app)
          fi
          if [[ "${{ needs.prepare.outputs.build_storybook }}" == "true" ]]; then
            artifacts+=(storybook)
          fi
          .github/workflows/scripts/frontend-build-artifacts.sh "${artifacts[@]}"

      - name: Configure Docker insecure registry
        if: needs.prepare.outputs.build_user_management == 'true' || needs.prepare.outputs.build_product_management == 'true' || needs.prepare.outputs.build_order_management == 'true' || needs.prepare.outputs.build_online_storefront == 'true' || needs.prepare.outputs.build_storybook == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if docker info 2>/dev/null | grep -F "$NEXUS_DOCKER_REGISTRY" >/dev/null; then
            echo "Docker already trusts insecure registry $NEXUS_DOCKER_REGISTRY"
            exit 0
          fi

          if ! sudo -n true 2>/dev/null; then
            echo "Docker must be configured to trust HTTP registry $NEXUS_DOCKER_REGISTRY before images can be pushed." >&2
            echo "Either preconfigure /etc/docker/daemon.json on the self-hosted runner or allow passwordless sudo for the runner user." >&2
            exit 1
          fi

          sudo mkdir -p /etc/docker
          if [[ -f /etc/docker/daemon.json ]]; then
            sudo cp /etc/docker/daemon.json /tmp/docker-daemon.json
          else
            printf '{}\n' > /tmp/docker-daemon.json
          fi

          python3 - "$NEXUS_DOCKER_REGISTRY" /tmp/docker-daemon.json <<'PY'
          import json
          import sys

          registry = sys.argv[1]
          path = sys.argv[2]

          with open(path, "r", encoding="utf-8") as fh:
              config = json.load(fh)

          registries = config.setdefault("insecure-registries", [])
          if registry not in registries:
              registries.append(registry)

          with open(path, "w", encoding="utf-8") as fh:
              json.dump(config, fh, indent=2)
              fh.write("\n")
          PY

          sudo cp /tmp/docker-daemon.json /etc/docker/daemon.json
          sudo systemctl restart docker || sudo service docker restart
          docker info

      - name: Build local application images
        if: needs.prepare.outputs.build_user_management == 'true' || needs.prepare.outputs.build_product_management == 'true' || needs.prepare.outputs.build_order_management == 'true' || needs.prepare.outputs.build_online_storefront == 'true' || needs.prepare.outputs.build_storybook == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ needs.prepare.outputs.build_user_management }}" == "true" ]]; then
            docker build \
              -f dockerfile \
              --build-arg APP_NAME=user-service \
              -t "$IMAGE_PREFIX/user-service:$IMAGE_TAG" \

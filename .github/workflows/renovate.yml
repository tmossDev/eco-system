name: Renovate

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run Renovate without creating or updating PRs.
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - full
          - lookup
      log_level:
        description: Renovate log level.
        required: true
        default: info
        type: choice
        options:
          - info
          - debug

permissions:
  contents: read

jobs:
  renovate:
    name: Run Renovate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Renovate
        uses: renovatebot/github-action@v46.1.14
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: ${{ inputs.log_level }}
          RENOVATE_DRY_RUN: ${{ inputs.dry_run }}
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}

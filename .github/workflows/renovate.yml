name: Renovate

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run Renovate without creating or updating PRs.
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - full
          - lookup
      log_level:
        description: Renovate log level.
        required: true
        default: info
        type: choice
        options:
          - info
          - debug

permissions:
  contents: read

jobs:
  renovate:
    name: Run Renovate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Renovate token
        shell: bash
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${RENOVATE_TOKEN:-}" ]]; then
            echo "Missing RENOVATE_TOKEN repository secret." >&2
            echo "Create a GitHub PAT and save it as the RENOVATE_TOKEN secret before running this workflow." >&2
            exit 1
          fi

      - name: Run Renovate
        uses: renovatebot/github-action@v46.1.17
        with:
          configurationFile: .github/workflows/configs/renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: ${{ inputs.log_level }}
          RENOVATE_DRY_RUN: ${{ inputs.dry_run }}
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}

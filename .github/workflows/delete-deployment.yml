name: Delete Deployment

on:
  workflow_dispatch:
    inputs:
      layer:
        description: Deployment layer to delete
        required: true
        default: application
        type: choice
        options:
          - ci-cd
          - application
          - foundation
          - all
      deployment:
        description: Main uses the default application namespace. Feature/custom uses the namespace input.
        required: true
        default: main
        type: choice
        options:
          - main
          - feature
          - custom
      namespace:
        description: Feature suffix or custom application namespace. Ignored for main and foundation-only deletes.
        required: false
        default: ""
      delete_namespace:
        description: Delete the application namespace after uninstalling application releases.
        required: true
        default: true
        type: boolean
      environment_file:
        description: Environment config file under config/
        required: true
        default: hp-prodesk-homelab.txt
      confirmation:
        description: Type delete for application deletes. Type delete-foundation when layer includes foundation or ci-cd.
        required: true
        default: ""

permissions:
  contents: read

env:
  ENVIRONMENT_FILE: ${{ inputs.environment_file || 'hp-prodesk-homelab.txt' }}

jobs:
  delete:
    name: Delete selected deployment
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve delete context
        shell: bash
        run: |
          set -euo pipefail

          CONFIG_FILE="config/${ENVIRONMENT_FILE}"
          if [[ ! -f "$CONFIG_FILE" ]]; then
            echo "Missing environment config: $CONFIG_FILE" >&2
            exit 1
          fi

          set -a
          . "$CONFIG_FILE"
          set +a

          LAYER="${{ inputs.layer }}"
          DEPLOYMENT="${{ inputs.deployment }}"
          REQUESTED_NAMESPACE="${{ inputs.namespace }}"
          CONFIRMATION="${{ inputs.confirmation }}"

          DELETE_FOUNDATION=false
          DELETE_APPLICATION=false
          DELETE_CI_CD=false

          case "$LAYER" in
            ci-cd)
              DELETE_CI_CD=true
              ;;
            foundation)
              DELETE_FOUNDATION=true
              ;;
            application)
              DELETE_APPLICATION=true
              ;;
            all)
              DELETE_CI_CD=true
              DELETE_FOUNDATION=true
              DELETE_APPLICATION=true
              ;;
            *)
              echo "Unknown layer: $LAYER" >&2
              exit 1
              ;;
          esac

          if [[ "$DELETE_FOUNDATION" == "true" || "$DELETE_CI_CD" == "true" ]]; then
            if [[ "$CONFIRMATION" != "delete-foundation" ]]; then
              echo "Foundation and CI/CD deletes require confirmation: delete-foundation" >&2
              exit 1
            fi
          elif [[ "$CONFIRMATION" != "delete" ]]; then
            echo "Application deletes require confirmation: delete" >&2
            exit 1
          fi

          case "$DEPLOYMENT" in
            main)
              NAMESPACE="${DEFAULT_APPLICATION_NAMESPACE:-eco-test}"
              ;;
            feature)
              if [[ ! "$REQUESTED_NAMESPACE" =~ ^[a-z0-9]{1,10}$ ]]; then
                echo "Feature deletes require namespace to be the 1-10 character feature suffix, for example checkout" >&2
                exit 1
              fi
              NAMESPACE="$REQUESTED_NAMESPACE"
              ;;
            custom)
              if [[ -z "$REQUESTED_NAMESPACE" ]]; then
                echo "Custom deletes require a namespace input" >&2
                exit 1
              fi
              NAMESPACE="$REQUESTED_NAMESPACE"
              ;;
            *)
              echo "Unknown deployment: $DEPLOYMENT" >&2
              exit 1
              ;;
          esac

          FOUNDATION_NAMESPACE="${FOUNDATION_NAMESPACE:-eco-foundation}"
          CI_CD_NAMESPACE="${CI_CD_NAMESPACE:-eco-cicd}"

          {
            echo "DELETE_FOUNDATION=$DELETE_FOUNDATION"
            echo "DELETE_APPLICATION=$DELETE_APPLICATION"
            echo "DELETE_CI_CD=$DELETE_CI_CD"
            echo "NAMESPACE=$NAMESPACE"
            echo "FOUNDATION_NAMESPACE=$FOUNDATION_NAMESPACE"
            echo "CI_CD_NAMESPACE=$CI_CD_NAMESPACE"
            echo "INGRESS_TLS_SECRET_NAME=${INGRESS_TLS_SECRET_NAME:-}"
          } >> "$GITHUB_ENV"

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          if [[ -f "$HOME/.kube/config" ]] && kubectl config current-context >/dev/null 2>&1; then
            echo "Using existing runner kubeconfig at $HOME/.kube/config"
          elif [[ -f "$HOME/.config/k3d/kubeconfig-${K3D_CLUSTER:-eco-cluster}.yaml" ]]; then
            cp "$HOME/.config/k3d/kubeconfig-${K3D_CLUSTER:-eco-cluster}.yaml" "$HOME/.kube/config"
          elif command -v k3d >/dev/null 2>&1 && k3d cluster list "${K3D_CLUSTER:-eco-cluster}" >/dev/null 2>&1; then
            k3d kubeconfig get "${K3D_CLUSTER:-eco-cluster}" > "$HOME/.kube/config"
          elif [[ -f /etc/rancher/k3s/k3s.yaml ]]; then
            sudo cat /etc/rancher/k3s/k3s.yaml > "$HOME/.kube/config"
          elif [[ -n "${KUBE_CONFIG_B64:-}" ]]; then
            echo "$KUBE_CONFIG_B64" | base64 --decode > "$HOME/.kube/config"
          else
            echo "No usable kubeconfig found. Add one at $HOME/.kube/config on the runner, install k3s config at /etc/rancher/k3s/k3s.yaml, or set KUBE_CONFIG_B64." >&2
            exit 1
          fi
          chmod 600 "$HOME/.kube/config"
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}

      - name: Check Kubernetes API
        shell: bash
        run: |
          set -euo pipefail
          kubectl config current-context
          echo "Kubernetes server: $(kubectl config view --minify --raw -o jsonpath='{.clusters[0].cluster.server}')"
          kubectl version --client
          kubectl get --raw=/version
          kubectl get --raw=/api

      - name: Delete application releases
        if: env.DELETE_APPLICATION == 'true'
        shell: bash
        run: |
          helm uninstall product-management --namespace "$NAMESPACE" --ignore-not-found
          helm uninstall order-management --namespace "$NAMESPACE" --ignore-not-found
          helm uninstall online-storefront --namespace "$NAMESPACE" --ignore-not-found
          helm uninstall user-management --namespace "$NAMESPACE" --ignore-not-found
          helm uninstall shared-components --namespace "$NAMESPACE" --ignore-not-found

      - name: Delete application ingress TLS secret
        if: env.DELETE_APPLICATION == 'true'
        shell: bash
        run: |
          if [[ -z "${INGRESS_TLS_SECRET_NAME:-}" ]]; then
            echo "INGRESS_TLS_SECRET_NAME is empty; no ingress TLS secret to delete."
            exit 0
          fi

          kubectl delete secret "$INGRESS_TLS_SECRET_NAME" \
            --namespace "$NAMESPACE" \
            --ignore-not-found

      - name: Delete application namespace
        if: env.DELETE_APPLICATION == 'true' && inputs.delete_namespace
        shell: bash
        run: |
          kubectl delete namespace "$NAMESPACE" --ignore-not-found --wait=false

      - name: Delete foundation release
        if: env.DELETE_FOUNDATION == 'true'
        shell: bash
        run: |
          helm uninstall foundation --namespace "$FOUNDATION_NAMESPACE" --ignore-not-found

      - name: Delete CI/CD release
        if: env.DELETE_CI_CD == 'true'
        shell: bash
        run: |
          helm uninstall ci-cd --namespace "$CI_CD_NAMESPACE" --ignore-not-found
          kubectl delete namespace "$CI_CD_NAMESPACE" --ignore-not-found --wait=false

      - name: Show remaining namespaces
        shell: bash
        run: |
          kubectl get namespaces

services:
  user-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: ./user-management/backend/app/user-service
    ports:
      - "8081:8080"

  user-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: ./user-management/backend/app/user-gateway
    ports:
      - "8080:8080"
app:
  nameOverride: cart-gateway
  fullnameOverride: cart-gateway
  partOf: online-storefront
  component: backend
  image:
    repository: eco-system/cart-gateway
    tag: latest
    pullPolicy: IfNotPresent
  ports:
    - name: http
      containerPort: 8080
      protocol: TCP
  service:
    enabled: true
    ports:
      - name: http
        port: 8080
        targetPort: http
        protocol: TCP
  env:
    PORT: "8080"
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10

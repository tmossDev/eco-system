{{- with .Values.productAdminWebAppStoriesIngress }}
{{- if and .enabled .host }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: product-admin-web-app-stories
  labels:
    app.kubernetes.io/name: product-admin-web-app-stories
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/version: {{ $.Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: product-management
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .className }}
  ingressClassName: {{ .className }}
  {{- end }}
  {{- with .tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .host | quote }}
      http:
        paths:
          - path: {{ .path | default "/stories/product-admin-web-app" }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ .serviceName | default "product-admin-web-app" }}
                port:
                  name: {{ .servicePortName | default "http" }}
{{- end }}
{{- end }}

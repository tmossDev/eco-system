product-service:
  app:
    image:
      pullPolicy: Never
    configMap:
      enabled: true
      data:
        DB_DIALECT: postgresql
        DB_PORT: "5432"
    secret:
      enabled: true
    ingress:
      enabled: true
      className: traefik

product-gateway:
  app:
    image:
      pullPolicy: Never
    configMap:
      enabled: true
      data:
        DB_DIALECT: postgresql
        DB_PORT: "5432"
        PRODUCT_SERVICE_URL: http://product-service:8080
        USER_SERVICE_URL: http://user-service:8080
    secret:
      enabled: true
    ingress:
      enabled: true
      className: traefik

product-admin-web-app:
  app:
    image:
      pullPolicy: Never
    nginxConfig:
      enabled: true
      data:
        default.conf: |
          server {
            listen 80;
            server_name _;
            root /usr/share/nginx/html;
            index index.html;

            location /assets/ {
              try_files $uri /storybook$uri =404;
            }

            location = /stories/product-admin-web-app {
              return 302 /stories/product-admin-web-app/;
            }

            location ^~ /stories/product-admin-web-app/stories/product-admin-web-app/ {
              rewrite ^/stories/product-admin-web-app/stories/product-admin-web-app/(.*)$ /storybook/$1 break;
              try_files $uri $uri/ /storybook/index.html;
            }

            location ^~ /stories/product-admin-web-app/ {
              rewrite ^/stories/product-admin-web-app/(.*)$ /storybook/$1 break;
              try_files $uri $uri/ /storybook/index.html;
            }

            location /storybook/ {
              try_files $uri $uri/ /storybook/index.html;
            }

            location / {
              try_files $uri $uri/ /index.html;
            }
          }
    configMap:
      enabled: false
      envFrom: false
      existingName: product-admin-web-app-runtime-config
    ingress:
      enabled: true
      className: traefik
    volumes:
      - name: runtime-config
        configMap:
          name: product-admin-web-app-runtime-config
          items:
            - key: config.json
              path: config.json

productAdminWebAppApiIngress:
  enabled: true
  className: traefik
  path: /api
  pathType: Prefix
  serviceName: product-gateway
  servicePortName: http

productAdminWebAppStoriesIngress:
  enabled: true
  className: traefik
  path: /stories/product-admin-web-app
  pathType: Prefix
  serviceName: product-admin-web-app
  servicePortName: http

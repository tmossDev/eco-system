app:
  nameOverride: storybook
  fullnameOverride: storybook
  partOf: shared-components
  component: frontend
  image:
    repository: eco-system/storybook
    tag: latest
    pullPolicy: IfNotPresent
  ports:
    - name: http
      containerPort: 80
      protocol: TCP
  service:
    enabled: true
    ports:
      - name: http
        port: 80
        targetPort: http
        protocol: TCP
  nginxConfig:
    enabled: true
    data:
      default.conf: |
        server {
          listen 80;
          server_name _;
          absolute_redirect off;
          root /var/www;
          index index.html;

          location = / {
            return 302 /storybook/;
          }

          location ^~ /storybook/ {
            try_files $uri $uri/ /storybook/index.html;
          }

          location / {
            return 404;
          }
        }
  ingress:
    enabled: true
    hosts:
      - host: storybook.local
        paths:
          - path: /
            pathType: Prefix
  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
